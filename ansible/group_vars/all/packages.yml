# Keys are site.yml roles, in run order; the packages block in site.yml carries the same tags.
packages_roles:
  apps:
    darwin:
      casks:
        - foobar2000
        - macdown-3000
  desktop:
    darwin:
      brew:
        - displayplacer
      casks:
        - font-jetbrains-mono-nerd-font
    xfce:
      apt: &xfce
        - arc-theme
        - fontconfig
        - papirus-icon-theme
        - pavucontrol
        - xfce4-appfinder
        - xfce4-clipman-plugin
        - xfce4-cpugraph-plugin
        - xfce4-docklike-plugin
        - xfce4-fsguard-plugin
        - xfce4-genmon-plugin
        - xfce4-netload-plugin
        - xfce4-pulseaudio-plugin
        - xfce4-screensaver
        - xfce4-systemload-plugin
        - xfce4-taskmanager
        - xfce4-terminal
      dnf: *xfce
  wox:
    darwin:
      casks:
        - wox
    debian:
      apt:
        - sqlite3
    rhel:
      dnf:
        - sqlite
    linux:
      appimage:
        - name: wox
          release: https://api.github.com/repos/Wox-launcher/Wox/releases/latest
          arm: arm64
          amd: amd64
  patches:
    darwin:
      casks:
        - helium-browser
        - sublime-text
        - visual-studio-code
        - waterfox
    linux:
      flatpak:
        - com.sublimetext.three
        - net.waterfox.waterfox
      appimage:
        - name: helium
          release: https://api.github.com/repos/imputnet/helium-linux/releases/latest
          arm: arm64
          amd: x86_64
  agentics:
    all:
      brew:
        - opencode
      uv:
        - { command: graphify, package: graphifyy }
    darwin:
      casks:
        - antigravity
        - antigravity-cli
        - codex
        - copilot-cli
