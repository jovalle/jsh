---
# Every package jsh installs, read by the packages role (see plugins/filter/packages.py).
# Selectors: all, linux (Debian and RHEL), darwin, debian, rhel, then the desktop (xfce,
# gnome). Each selector maps package managers to lists. A full run installs packages_common,
# every packages_roles entry, then host_vars extras. A run that names only configuration roles
# installs just their packages_roles entries, so keep an entry there only when that role's
# tasks need the package.
