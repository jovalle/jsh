---
# The workstation configures itself; scripts/configure.sh limits each run to one host: this
# machine's name when host_vars/HOST.yml exists, otherwise localhost. The controller's Python
# avoids interpreter discovery, which would run the macOS /usr/bin/python3 stub.
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  hosts:
    localhost:
    archon:
    colossus:
