---
- name: Flatpak is found
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - command -v flatpak
  register: packages_flatpak
  changed_when: false
  check_mode: false
  failed_when: false

- name: notice
  ansible.builtin.debug:
    msg: flatpak is missing; apps were skipped
  when: packages_flatpak.rc != 0

- name: Flatpak apps
  when: packages_flatpak.rc == 0
  block:
    - name: Flathub remote
      community.general.flatpak_remote:
        name: flathub
        flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
        method: user
        state: present
      when: not jsh_update | bool

    - name: Flatpak apps are installed
      community.general.flatpak:
        name: "{{ item }}"
        remote: flathub
        method: user
        state: present
      loop: "{{ packages_selected.flatpak }}"
      when: not jsh_update | bool

    - name: Installed Flatpak apps are listed
      ansible.builtin.command:
        argv:
          - flatpak
          - list
          - --app
          - --columns=application
      register: packages_flatpak_installed
      changed_when: false
      check_mode: false
      when: jsh_update | bool

    - name: Flatpak updates are listed
      ansible.builtin.command:
        argv:
          - flatpak
          - remote-ls
          - --updates
          - --columns=application
      register: packages_flatpak_updates
      changed_when: false
      check_mode: false
      when: jsh_update | bool

    - name: ok
      ansible.builtin.debug:
        msg: "{{ item }}"
      loop: "{{ packages_selected.flatpak }}"
      when: >-
        jsh_update | bool
        and item in packages_flatpak_installed.stdout_lines
        and item not in packages_flatpak_updates.stdout_lines

    - name: Flatpak update drift is reported
      ansible.builtin.command: "true"
      loop: "{{ packages_selected.flatpak }}"
      loop_control:
        label: "{{ item }}"
      changed_when: true
      check_mode: false
      when: >-
        jsh_update | bool and
        (item not in packages_flatpak_installed.stdout_lines
         or (ansible_check_mode and item in packages_flatpak_updates.stdout_lines))

    - name: Flatpak apps are updated
      ansible.builtin.command:
        argv:
          - flatpak
          - update
          - --noninteractive
          - -y
          - "{{ item }}"
      loop: "{{ packages_selected.flatpak }}"
      loop_control:
        label: "{{ item }}"
      changed_when: true
      register: packages_flatpak_updated
      when: >-
        jsh_update | bool and not ansible_check_mode
        and item in packages_flatpak_updates.stdout_lines

    # A running Flatpak app keeps the previous version until it restarts.
    - name: Flatpak upgrades wait for a manual restart
      when: packages_flatpak_upgraded | length > 0
      vars:
        packages_flatpak_upgraded: >-
          {{ packages_flatpak_updated.results | default([]) | selectattr('changed') | map(attribute='item') | list }}
      block:
        - name: Running Flatpak apps are listed
          ansible.builtin.command:
            argv:
              - flatpak
              - ps
              - --columns=application
          register: packages_flatpak_running
          changed_when: false
          check_mode: false

        - name: Flatpak app names are listed
          ansible.builtin.command:
            argv:
              - flatpak
              - list
              - --app
              - --columns=application,name
          register: packages_flatpak_names
          changed_when: false
          check_mode: false

        - name: notice
          ansible.builtin.debug:
            msg: "restart {{ packages_flatpak_label[item] | default(item) }} to use the updated version"
          loop: "{{ packages_flatpak_upgraded | select('in', packages_flatpak_running.stdout_lines) | list }}"
          vars:
            packages_flatpak_label: "{{ dict(packages_flatpak_names.stdout_lines | map('split', '\t')) }}"
