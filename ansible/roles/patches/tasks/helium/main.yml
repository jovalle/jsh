---
- name: Helium command is found
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - 'command -v helium'
  register: patches_helium_command
  changed_when: false
  check_mode: false
  failed_when: false

- name: Helium profile root is checked
  ansible.builtin.stat:
    path: "{{ patches_helium_profile_root }}"
  register: patches_helium_root

- name: Helium application is checked
  ansible.builtin.stat:
    path: /Applications/Helium.app
  register: patches_helium_application
  when: jsh_platform == 'darwin'

- name: info
  ansible.builtin.debug:
    msg: "Skipping Helium configuration: Helium is not installed"
  when: >-
    patches_helium_command.rc != 0 and not patches_helium_root.stat.isdir | default(false)
    and not patches_helium_application.stat.isdir | default(false)

- name: Helium configuration is managed
  when: >-
    patches_helium_command.rc == 0 or patches_helium_root.stat.isdir | default(false)
    or patches_helium_application.stat.isdir | default(false)
  block:
    - name: Helium policy values are initialized
      ansible.builtin.set_fact:
        patches_helium_policy_values: >-
          {{ lookup('ansible.builtin.file',
                    jsh_root ~ '/ansible/roles/patches/files/helium/policy.json') | from_json }}

    - name: Helium policy overlays are checked
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ patches_helium_overlays }}"
      register: patches_helium_policy_overlay_stats
      loop_control:
        label: "{{ item }}"

    - name: Helium policy overlays are merged
      ansible.builtin.set_fact:
        patches_helium_policy_values: >-
          {{ patches_helium_policy_values
             | combine(lookup('ansible.builtin.file', item.item) | from_json, recursive=true) }}
      loop: "{{ patches_helium_policy_overlay_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.isreg | default(false)

    - name: Helium macOS policy values are selected
      ansible.builtin.set_fact:
        patches_helium_policy_values: >-
          {{ patches_helium_policy_values
             | combine({'ExtensionForceInstallWithSearchOrNewTabOverridesEnabled': true,
                        'ExtensionInstallForcelist':
                          patches_helium_policy_values.ExtensionInstallForcelist
                          + ['fgmjlmbojbkmdpofahffgcpkhkngfpef']}, recursive=true)
             if jsh_platform == 'darwin' else patches_helium_policy_values }}

    - name: Helium policy is checked
      settings:
        path: "{{ patches_helium_policy_path }}"
        values: "{{ patches_helium_policy_values }}"
        format: "{{ 'plist' if jsh_platform == 'darwin' else 'json' }}"
        merge: replace
      check_mode: true
      register: patches_helium_policy_probe

    - name: ok
      ansible.builtin.debug:
        msg: "{{ patches_helium_policy_path }}"
      when: patches_helium_policy_probe is not changed

    - name: "{{ patches_helium_policy_path }}"
      ansible.builtin.command: "true"
      changed_when: true
      check_mode: false
      when: patches_helium_policy_probe is changed and ansible_check_mode

    - name: Helium policy admin access is checked
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - "true"
      vars:
        # Cached sudo authorization belongs to the invoking terminal session.
        ansible_worker_session_isolation: false
      register: patches_helium_policy_admin
      changed_when: false
      check_mode: false
      failed_when: false
      when: >-
        patches_helium_policy_probe is changed
        and not ansible_check_mode and patches_helium_policy_become | bool

    - name: Helium policy requires administrator access
      ansible.builtin.fail:
        msg: "{{ patches_helium_policy_path }} needs sudo. Run sudo -v first, then rerun."
      when: patches_helium_policy_admin.rc | default(0) != 0

    - name: "{{ patches_helium_policy_path }}"
      settings:
        path: "{{ patches_helium_policy_path }}"
        values: "{{ patches_helium_policy_values }}"
        format: "{{ 'plist' if jsh_platform == 'darwin' else 'json' }}"
        merge: replace
      become: "{{ patches_helium_policy_become | bool }}"
      vars:
        ansible_worker_session_isolation: false
      when: patches_helium_policy_probe is changed and not ansible_check_mode
      register: patches_helium_policy_write

    - name: Helium policy change is recorded
      ansible.builtin.set_fact:
        patches_helium_policy_changed: "{{ patches_helium_policy_write is changed }}"

    - name: Helium search policy manifest is read
      ansible.builtin.command:
        argv:
          - plutil
          - -convert
          - json
          - -o
          - "-"
          - "{{ patches_helium_manifest_path }}"
      register: patches_helium_manifest
      changed_when: false
      check_mode: false
      failed_when: false
      when: jsh_platform == 'darwin'

    - name: notice
      ansible.builtin.debug:
        msg: "cannot verify the temporary Helium search policy; check helium://policy"
      when: jsh_platform == 'darwin' and patches_helium_manifest.rc != 0

    - name: Helium temporary search policy is checked
      ansible.builtin.command:
        argv:
          - jq
          - -e
          - >-
            .. | objects |
            select(.pfm_name? ==
            "ExtensionForceInstallWithSearchOrNewTabOverridesEnabled")
        stdin: "{{ patches_helium_manifest.stdout }}"
      register: patches_helium_manifest_policy
      changed_when: false
      check_mode: false
      failed_when: false
      when: jsh_platform == 'darwin' and patches_helium_manifest.rc == 0

    - name: notice
      ansible.builtin.debug:
        msg: >-
          Helium does not list the temporary search policy; check helium://policy and choose
          Startpage manually if needed
      when: >-
        jsh_platform == 'darwin' and patches_helium_manifest.rc == 0
        and patches_helium_manifest_policy.rc != 0

    - name: Default Helium profile is checked
      ansible.builtin.stat:
        path: "{{ patches_helium_profile_root }}/Default/Preferences"
      register: patches_helium_default_profile

    - name: Helium profiles are found
      ansible.builtin.find:
        paths: "{{ patches_helium_profile_root }}"
        patterns: Preferences
        file_type: file
        recurse: true
        depth: 2
      register: patches_helium_found_profiles
      when: patches_helium_root.stat.isdir | default(false)

    - name: Helium profile candidates are selected
      ansible.builtin.set_fact:
        patches_helium_profiles: >-
          {{ [patches_helium_profile_root ~ '/Default/Preferences']
             if patches_helium_default_profile.stat.isreg | default(false)
             else (patches_helium_found_profiles.files | default([]) | map(attribute='path') | list) }}

    - name: notice
      ansible.builtin.debug:
        msg: open Helium once to create a profile, then rerun
      when: patches_helium_profiles | length == 0

    - name: notice
      ansible.builtin.debug:
        msg: several profiles and no Default profile; choose one by hand
      when: patches_helium_profiles | length > 1

    - name: Helium profile is selected
      ansible.builtin.set_fact:
        patches_helium_preferences: "{{ patches_helium_profiles[0] }}"
        patches_helium_profile: "{{ patches_helium_profiles[0] | dirname }}"
      when: patches_helium_profiles | length == 1

    - name: ok
      ansible.builtin.debug:
        msg: "Helium profile is {{ patches_helium_profile }}"
      when: patches_helium_profiles | length == 1

    - name: Helium policy waits for a manual restart
      when: patches_helium_policy_changed | bool and (jsh_keep_apps | bool or patches_helium_profiles | length != 1)
      block:
        - name: Helium policy process is checked
          ansible.builtin.command:
            argv:
              - pgrep
              - -u
              - "{{ lookup('ansible.builtin.pipe', 'id -u') }}"
              - -x
              - helium|Helium|helium-bin
          register: patches_helium_policy_process
          changed_when: false
          check_mode: false
          failed_when: patches_helium_policy_process.rc not in [0, 1]

        - name: notice
          ansible.builtin.debug:
            msg: restart Helium to apply the changed policy
          when: patches_helium_policy_process.rc == 0

    - name: Helium profile preferences are managed
      when: patches_helium_profiles | length == 1
      block:
        - name: Helium profile values are selected
          ansible.builtin.command:
            argv:
              - bash
              - -c
              - |
                set -euo pipefail
                preferences=$1
                root=$2
                policy=$3
                toolbar_order=$4
                set --
                . "${JSH_ROOT:?}/ansible/helpers/apps.sh"
                current=${APP_TMP}/current-preferences.json
                app::jsonc "${preferences}" >"${current}"
                jq -n --slurpfile base "${JSH_ROOT}/ansible/roles/patches/files/helium/preferences.json" \
                  --argjson policy "${policy}" --argjson order "${toolbar_order}" \
                  --slurpfile current "${current}" '
                  [($policy.ExtensionSettings // {}) | to_entries | sort_by(.key)[] |
                    select(.value.toolbar_pin == "force_pinned") | .key] as $forced |
                  ([$order[] | select(. as $id | $forced | index($id))] +
                    [$forced[] | select(. as $id | $order | index($id) | not)]) as $pinned |
                  [($policy.ExtensionInstallForcelist // [])[] | split(";")[0]] as $managed |
                  # Remove the pin left by the old 1Password policy unless explicitly force-pinned.
                  ($pinned + $managed + ["aeblfdkhhhdcdjpifhhbdiojplfjncoa"]) as $replaced |
                  ($current[0].extensions.pinned_extensions // []) as $existing |
                  if ($existing | type) != "array" or any($existing[]; type != "string") then
                    error("Helium pinned extensions must be a string array")
                  else $base[0] * {extensions: {pinned_extensions:
                    ($pinned + [$existing[] | select(. as $id | $replaced | index($id) | not)])}} end
                ' >"${APP_TMP}/preferences.json"
                if [[ -f "${root}/Local State" ]]; then
                  app::jsonc "${root}/Local State" >"${APP_TMP}/current-state.json"
                else
                  printf "{}\n" >"${APP_TMP}/current-state.json"
                fi
                jq -n --slurpfile state "${JSH_ROOT}/ansible/roles/patches/files/helium/state.json" \
                  --slurpfile current "${APP_TMP}/current-state.json" '
                  ($current[0].browser.enabled_labs_experiments // []) as $flags |
                  if ($flags | type) != "array" or any($flags[]; type != "string") then
                    error("Helium experimental flags must be a string array")
                  else $state[0] * {browser: {enabled_labs_experiments:
                    (($flags | map(select(. != "enable-experimental-web-platform-features" and
                      (startswith("enable-experimental-web-platform-features@") | not)))) +
                      ["enable-experimental-web-platform-features"])}} end
                ' >"${APP_TMP}/state.json"
                jq -n --slurpfile preferences "${APP_TMP}/preferences.json" \
                  --slurpfile state "${APP_TMP}/state.json" \
                  '{preferences: $preferences[0], state: $state[0]}'
              - jsh-helium-values
              - "{{ patches_helium_preferences }}"
              - "{{ patches_helium_profile_root }}"
              - "{{ patches_helium_policy_values | to_json }}"
              - "{{ patches_helium_toolbar_order | to_json }}"
          environment: "{{ jsh_script_env }}"
          register: patches_helium_desired
          changed_when: false
          check_mode: false

        - name: Helium desired profile values are recorded
          ansible.builtin.set_fact:
            patches_helium_preferences_values: "{{ (patches_helium_desired.stdout | from_json).preferences }}"
            patches_helium_state_values: "{{ (patches_helium_desired.stdout | from_json).state }}"

        - name: "{{ patches_helium_preferences }} is pending"
          settings:
            path: "{{ patches_helium_preferences }}"
            values: "{{ patches_helium_preferences_values }}"
          check_mode: true
          register: patches_helium_preferences_pending

        - name: "{{ patches_helium_profile_root }}/Local State is pending"
          settings:
            path: "{{ patches_helium_profile_root }}/Local State"
            values: "{{ patches_helium_state_values }}"
          check_mode: true
          register: patches_helium_state_pending

        - name: ok
          ansible.builtin.debug:
            msg: Helium profile preferences are current
          when: >-
            patches_helium_preferences_pending is not changed and patches_helium_state_pending is not changed

        - name: Helium secure preferences are read
          ansible.builtin.slurp:
            src: "{{ patches_helium_profile }}/Secure Preferences"
          register: patches_helium_secure_file
          failed_when: false

        - name: Helium secure preferences are decoded
          ansible.builtin.set_fact:
            patches_helium_secure: >-
              {{ patches_helium_secure_file.content | b64decode | from_json
                 if patches_helium_secure_file.content is defined else {} }}

        - name: notice
          ansible.builtin.debug:
            msg: >-
              Startpage extension is missing or disabled; restart Helium, enable extension
              downloads, and check helium://extensions
          vars:
            patches_helium_startpage: >-
              {{ (((patches_helium_secure.extensions | default({})).settings | default({}))
                  .fgmjlmbojbkmdpofahffgcpkhkngfpef | default({})) }}
          when: >-
            jsh_platform == "darwin" and
            (patches_helium_startpage is not mapping
             or patches_helium_startpage | length == 0
             or patches_helium_startpage.disable_reasons | default([]) is not sequence
             or patches_helium_startpage.disable_reasons | default([]) | length != 0)

        - name: ok
          ansible.builtin.debug:
            msg: Startpage extension is installed and enabled
          vars:
            patches_helium_startpage: >-
              {{ (((patches_helium_secure.extensions | default({})).settings | default({}))
                  .fgmjlmbojbkmdpofahffgcpkhkngfpef | default({})) }}
          when: >-
            jsh_platform == "darwin"
            and patches_helium_startpage is mapping
            and patches_helium_startpage | length > 0
            and patches_helium_startpage.disable_reasons | default([]) is sequence
            and patches_helium_startpage.disable_reasons | default([]) | length == 0

        - name: Helium unpacked extension files are checked
          ansible.builtin.stat:
            path: "{{ item }}"
          loop: "{{ patches_helium_unpack_overlays }}"
          register: patches_helium_unpack_stats
          loop_control:
            label: "{{ item }}"
          when: jsh_platform == 'darwin'

        - name: Helium unpacked extension file is selected
          ansible.builtin.set_fact:
            patches_helium_unpack_file: >-
              {{ patches_helium_unpack_stats.results | default([])
                 | selectattr('stat.isreg', 'defined') | selectattr('stat.isreg')
                 | map(attribute='item') | first | default('') }}
          when: jsh_platform == 'darwin'

        - name: Helium unpacked extensions
          ansible.builtin.command:
            argv:
              - "{{ role_path }}/files/helium/unpacked.sh"
              - "{{ patches_helium_profile }}"
          environment: "{{ jsh_script_env }}"
          register: patches_helium_unpacked
          changed_when: patches_helium_unpacked.stdout is reported_change
          check_mode: false
          when: jsh_platform == 'darwin' and patches_helium_unpack_file | length > 0

        - name: ok
          ansible.builtin.debug:
            msg: Helium unpacked extensions are current
          when: jsh_platform != 'darwin' or patches_helium_unpack_file | default('') | length == 0

        - name: Helium restarts for its profile settings
          ansible.builtin.include_role:
            name: app
          vars:
            app_label: Helium
            app_process: helium|Helium|helium-bin
            app_launch: "{{ ['open', '-a', 'Helium'] if jsh_platform == 'darwin' else ['helium'] }}"
            app_role: patches
            app_tasks: helium/apply.yml
            app_pending: >-
              {{ patches_helium_preferences_pending is changed or patches_helium_state_pending is changed
                 or (not jsh_keep_apps | bool
                     and (patches_helium_policy_changed | bool
                          or (ansible_check_mode and patches_helium_policy_probe is changed))) }}
            app_live: false
