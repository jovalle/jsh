---
- name: Waterfox command is found
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - 'command -v waterfox'
  register: patches_waterfox_command
  changed_when: false
  check_mode: false
  failed_when: false

- name: Waterfox profile roots are checked
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ patches_waterfox_roots }}"
  register: patches_waterfox_root_stats
  loop_control:
    label: "{{ item }}"

- name: Waterfox application is checked
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /Applications/Waterfox.app
    - /var/lib/flatpak/app/net.waterfox.waterfox
  register: patches_waterfox_applications
  loop_control:
    label: "{{ item }}"

- name: Waterfox installation is detected
  ansible.builtin.set_fact:
    patches_waterfox_present: >-
      {{ patches_waterfox_command.rc == 0
         or patches_waterfox_root_stats.results | selectattr('stat.isdir', 'defined')
            | selectattr('stat.isdir') | list | length > 0
         or patches_waterfox_applications.results | selectattr('stat.isdir', 'defined')
            | selectattr('stat.isdir') | list | length > 0 }}

- name: info
  ansible.builtin.debug:
    msg: "Skipping Waterfox configuration: Waterfox is not installed"
  when: not patches_waterfox_present

- name: Waterfox configuration is managed
  when: patches_waterfox_present
  block:
    - name: Waterfox native application is checked
      ansible.builtin.stat:
        path: "{{ (patches_waterfox_command.stdout | realpath | dirname) ~ '/application.ini' }}"
      register: patches_waterfox_native
      when: patches_waterfox_command.rc == 0 and jsh_platform != 'darwin'

    - name: Waterfox policy values are initialized
      ansible.builtin.set_fact:
        patches_waterfox_policy_values: >-
          {{ lookup('ansible.builtin.file',
                    jsh_root ~ '/ansible/roles/patches/files/waterfox/policies.json') | from_json }}

    - name: Waterfox policy overlays are checked
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ patches_waterfox_policy_overlays }}"
      register: patches_waterfox_policy_overlay_stats
      loop_control:
        label: "{{ item }}"

    - name: Waterfox policy overlays are merged
      ansible.builtin.set_fact:
        patches_waterfox_policy_values: >-
          {{ patches_waterfox_policy_values
             | combine(lookup('ansible.builtin.file', item.item) | from_json, recursive=true) }}
      loop: "{{ patches_waterfox_policy_overlay_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.isreg | default(false)

    - name: Waterfox policy target is selected
      ansible.builtin.set_fact:
        patches_waterfox_policy_target: >-
          {{ patches_waterfox_policy_path if jsh_platform == 'darwin'
             else (patches_waterfox_command.stdout | realpath | dirname) ~ '/distribution/policies.json' }}
        patches_waterfox_policy_format: "{{ 'plist' if jsh_platform == 'darwin' else 'json' }}"
        patches_waterfox_policy_content: >-
          {{ patches_waterfox_policy_values | combine({'EnterprisePoliciesEnabled': true})
             if jsh_platform == 'darwin' else {'policies': patches_waterfox_policy_values} }}
      when: >-
        jsh_platform == 'darwin'
        or (patches_waterfox_command.rc == 0 and patches_waterfox_native.stat.isreg | default(false))

    - name: Waterfox policy is checked
      settings:
        path: "{{ patches_waterfox_policy_target }}"
        values: "{{ patches_waterfox_policy_content }}"
        format: "{{ patches_waterfox_policy_format }}"
        merge: replace
      check_mode: true
      failed_when: false
      register: patches_waterfox_policy_probe
      when: patches_waterfox_policy_target is defined

    - name: ok
      ansible.builtin.debug:
        msg: "{{ patches_waterfox_policy_target }}"
      when: >-
        patches_waterfox_policy_target is defined and patches_waterfox_policy_probe.msg is not defined
        and patches_waterfox_policy_probe is not changed

    - name: "{{ patches_waterfox_policy_target }}"
      ansible.builtin.command: "true"
      changed_when: true
      check_mode: false
      when: >-
        patches_waterfox_policy_target is defined and patches_waterfox_policy_probe.msg is not defined
        and patches_waterfox_policy_probe is changed and ansible_check_mode

    - name: Waterfox policy admin access is checked
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - "true"
      vars:
        # Cached sudo authorization belongs to the invoking terminal session.
        ansible_worker_session_isolation: false
      register: patches_waterfox_policy_admin
      changed_when: false
      check_mode: false
      failed_when: false
      when: >-
        patches_waterfox_policy_probe.msg is not defined and patches_waterfox_policy_probe is changed
        and not ansible_check_mode and patches_waterfox_policy_become | bool

    - name: "{{ patches_waterfox_policy_target }}"
      settings:
        path: "{{ patches_waterfox_policy_target }}"
        values: "{{ patches_waterfox_policy_content }}"
        format: "{{ patches_waterfox_policy_format }}"
        merge: replace
      become: "{{ patches_waterfox_policy_become | bool }}"
      vars:
        ansible_worker_session_isolation: false
      when: >-
        patches_waterfox_policy_target is defined and patches_waterfox_policy_probe.msg is not defined
        and patches_waterfox_policy_probe is changed and not ansible_check_mode
        and (not patches_waterfox_policy_become | bool or patches_waterfox_policy_admin.rc | default(1) == 0)

    - name: notice
      ansible.builtin.debug:
        msg: >-
          {{ patches_waterfox_policy_target | default('Waterfox policy') }} needs sudo;
          run `sudo -v` first, then rerun
      when: >-
        patches_waterfox_policy_target is defined
        and (patches_waterfox_policy_probe.msg is defined
             or (patches_waterfox_policy_probe is changed and not ansible_check_mode
                 and patches_waterfox_policy_become | bool
                 and patches_waterfox_policy_admin.rc | default(1) != 0))

    - name: Waterfox profiles.ini files are checked
      ansible.builtin.stat:
        path: "{{ item }}/profiles.ini"
      loop: "{{ patches_waterfox_roots }}"
      register: patches_waterfox_ini_stats
      loop_control:
        label: "{{ item }}/profiles.ini"

    - name: Waterfox profile registrations are read
      ansible.builtin.command:
        argv:
          - awk
          - -f
          - "{{ jsh_root }}/ansible/roles/patches/files/waterfox/profiles.awk"
          - "{{ item.item }}/profiles.ini"
      loop: "{{ patches_waterfox_ini_stats.results }}"
      register: patches_waterfox_registrations
      changed_when: false
      check_mode: false
      when: item.stat.isreg | default(false)
      loop_control:
        label: "{{ item.item }}/profiles.ini"

    - name: Waterfox profile selection is initialized
      ansible.builtin.set_fact:
        patches_waterfox_profiles: []
        patches_waterfox_defaults: []

    - name: Waterfox profile registrations are evaluated
      ansible.builtin.include_tasks: waterfox/collect.yml
      loop: "{{ patches_waterfox_registrations.results }}"
      loop_control:
        loop_var: patches_waterfox_registration
        label: "{{ patches_waterfox_registration.item.item | default('profiles.ini') }}"
      when: patches_waterfox_registration.stdout_lines is defined

    - name: notice
      ansible.builtin.debug:
        msg: open Waterfox once to create a profile, then rerun
      when: patches_waterfox_profiles | length == 0

    - name: Waterfox profile is selected
      when: patches_waterfox_profiles | length > 0
      block:
        - name: ok
          ansible.builtin.debug:
            msg: "Waterfox has {{ patches_waterfox_profiles | length }} registered profiles"

        - name: Saved Waterfox profile is read
          ansible.builtin.slurp:
            src: "{{ patches_waterfox_state }}/jsh/waterfox-profile"
          register: patches_waterfox_saved_file
          failed_when: false

        - name: Waterfox requested profile is selected
          vars:
            patches_waterfox_saved: >-
              {{ patches_waterfox_saved_file.content | b64decode | trim
                 if patches_waterfox_saved_file.content is defined else '' }}
            patches_waterfox_saved_matches: >-
              {{ patches_waterfox_profiles | selectattr('path', 'equalto', patches_waterfox_saved) | list }}
          ansible.builtin.set_fact:
            patches_waterfox_requested: >-
              {{ (jsh_waterfox_profile
                  | regex_replace('^~/', patches_waterfox_home ~ '/'))
                 if jsh_waterfox_profile else patches_waterfox_saved
                 if patches_waterfox_saved_matches | length == 1 else '' }}
            patches_waterfox_explicit: "{{ jsh_waterfox_profile | length > 0 }}"

        - name: Waterfox requested profile matches are selected
          ansible.builtin.set_fact:
            patches_waterfox_matches: >-
              {{ ((patches_waterfox_profiles | selectattr('name', 'equalto', patches_waterfox_requested) | list)
                  + (patches_waterfox_profiles | selectattr('path', 'equalto', patches_waterfox_requested) | list))
                 | unique(attribute='path') | list }}
          when: patches_waterfox_requested | length > 0

        - name: notice
          ansible.builtin.debug:
            msg: profile name or path must match exactly one existing Waterfox profile
          when: patches_waterfox_requested | length > 0 and patches_waterfox_matches | length != 1

        - name: Waterfox requested profile is valid
          ansible.builtin.assert:
            that: patches_waterfox_matches | length == 1
            fail_msg: profile name or path must match exactly one existing Waterfox profile
          when: patches_waterfox_requested | length > 0

        - name: notice
          ansible.builtin.debug:
            msg: >-
              choose a Waterfox profile with JSH_WATERFOX_PROFILE='name or path'
              make configure patches
          when: patches_waterfox_requested | length == 0 and patches_waterfox_defaults | length != 1

        - name: Waterfox selected profile is set
          ansible.builtin.set_fact:
            patches_waterfox_selected: >-
              {{ patches_waterfox_matches[0].path if patches_waterfox_requested | length > 0
                 else patches_waterfox_defaults[0] }}
          when: >-
            (patches_waterfox_requested | length > 0 and patches_waterfox_matches | length == 1)
            or (patches_waterfox_requested | length == 0 and patches_waterfox_defaults | length == 1)

        - name: Waterfox selected profile is managed
          when: patches_waterfox_selected is defined
          block:
            - name: ok
              ansible.builtin.debug:
                msg: "Waterfox profile is {{ patches_waterfox_selected }}"

            - name: Waterfox user preference overlays are checked
              ansible.builtin.stat:
                path: "{{ item }}"
              loop: "{{ patches_waterfox_user_overlays }}"
              register: patches_waterfox_user_overlay_stats
              loop_control:
                label: "{{ item }}"

            - name: Waterfox user preference overlay is selected
              ansible.builtin.set_fact:
                patches_waterfox_user_overlay: >-
                  {{ patches_waterfox_user_overlay_stats.results
                     | selectattr('stat.isreg', 'defined') | selectattr('stat.isreg')
                     | map(attribute='item') | first | default('') }}

            - name: Waterfox user preferences are checked
              ansible.builtin.stat:
                path: "{{ patches_waterfox_selected }}/user.js"
              register: patches_waterfox_user_stat

            - name: Waterfox user preferences are assembled
              ansible.builtin.command:
                argv:
                  - bash
                  - -c
                  - |
                    set -euo pipefail
                    managed=$(mktemp)
                    trap 'rm -f "${managed}"' EXIT
                    cat "$1" >"${managed}"
                    if [[ -n $2 ]]; then
                      printf '\n' >>"${managed}"
                      cat "$2" >>"${managed}"
                    fi
                    current=$3
                    [[ -f ${current} ]] || current=/dev/null
                    awk '
                      FNR == NR {
                        if ($0 ~ /^user_pref\(["\047]/) {
                          key=$0
                          sub(/^user_pref\(["\047]/, "", key)
                          sub(/["\047].*$/, "", key)
                          if (key == "browser.uiCustomization.state") next
                          keys[key]=1
                        }
                        managed=managed $0 "\n"
                        next
                      }
                      $0 == "// BEGIN jsh preferences" { block=1; next }
                      $0 == "// END jsh preferences" { block=0; next }
                      block { next }
                      /^user_pref\(["\047]/ {
                        key=$0
                        sub(/^user_pref\(["\047]/, "", key)
                        sub(/["\047].*$/, "", key)
                        if (key in keys || key == "browser.uiCustomization.state") next
                      }
                      { kept=kept $0 "\n" }
                      END {
                        sub(/[[:space:]]+$/, "", kept)
                        sub(/[[:space:]]+$/, "", managed)
                        if (kept != "") printf "%s\n\n", kept
                        printf "// BEGIN jsh preferences\n%s\n// END jsh preferences\n", managed
                      }
                    ' "${managed}" "${current}"
                  - jsh-waterfox-user
                  - "{{ jsh_root }}/ansible/roles/patches/files/waterfox/user.js"
                  - "{{ patches_waterfox_user_overlay }}"
                  - "{{ patches_waterfox_selected }}/user.js"
              register: patches_waterfox_desired_user
              changed_when: false
              check_mode: false

            - name: "{{ patches_waterfox_selected | default('Waterfox profile') }}/user.js is pending"
              ansible.builtin.copy:
                content: |
                  {{ patches_waterfox_desired_user.stdout }}
                dest: "{{ patches_waterfox_selected }}/user.js"
                mode: "{{ patches_waterfox_user_stat.stat.mode | default('0600') }}"
                backup: true
              check_mode: true
              register: patches_waterfox_user_pending

            - name: Waterfox toolbar extensions are checked
              ansible.builtin.command:
                argv:
                  - "{{ role_path }}/files/waterfox/toolbar.sh"
                  - "{{ patches_waterfox_selected }}"
                stdin: "{{ patches_waterfox_policy_values | to_json }}"
              environment: >-
                {{ jsh_script_env | combine({'JSH_TOOLBAR_PROBE': '1'}) }}
              register: patches_waterfox_toolbar_probe
              changed_when: false
              check_mode: false

            - name: ok
              ansible.builtin.debug:
                msg: Waterfox profile preferences are current
              when: >-
                patches_waterfox_user_pending is not changed
                and patches_waterfox_toolbar_probe.stdout != 'pending'

            - name: Waterfox restarts for its profile settings
              ansible.builtin.include_role:
                name: app
              vars:
                app_label: Waterfox
                app_process: waterfox|waterfox-bin|Waterfox
                app_launch: >-
                  {{ ['open', '-a', 'Waterfox'] if jsh_platform == 'darwin'
                     else ['flatpak', 'run', 'net.waterfox.waterfox']
                     if patches_waterfox_selected.startswith(patches_waterfox_home ~ '/.var/app/')
                     else ['waterfox'] }}
                app_role: patches
                app_tasks: waterfox/apply.yml
                app_pending: >-
                  {{ patches_waterfox_user_pending is changed
                     or patches_waterfox_toolbar_probe.stdout == 'pending' }}
                app_live: true

            - name: Waterfox profile state directory exists
              ansible.builtin.file:
                path: "{{ patches_waterfox_state }}/jsh"
                state: directory
                mode: u+rwx
              when: patches_waterfox_explicit

            - name: "{{ patches_waterfox_state }}/jsh/waterfox-profile"
              ansible.builtin.copy:
                content: |
                  {{ patches_waterfox_selected }}
                dest: "{{ patches_waterfox_state }}/jsh/waterfox-profile"
                mode: "0644"
              when: patches_waterfox_explicit
