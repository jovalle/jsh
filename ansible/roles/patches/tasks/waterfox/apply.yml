---
- name: "{{ patches_waterfox_selected }}/user.js"
  ansible.builtin.copy:
    content: |
      {{ patches_waterfox_desired_user.stdout }}
    dest: "{{ patches_waterfox_selected }}/user.js"
    mode: "{{ patches_waterfox_user_stat.stat.mode | default('0600') }}"
    backup: true

- name: Waterfox toolbar extensions
  ansible.builtin.command:
    argv:
      - "{{ role_path }}/files/waterfox/toolbar.sh"
      - "{{ patches_waterfox_selected }}"
    stdin: "{{ patches_waterfox_policy_values | to_json }}"
  environment: "{{ jsh_script_env }}"
  register: patches_waterfox_toolbar
  changed_when: patches_waterfox_toolbar.stdout is reported_change
  check_mode: false
