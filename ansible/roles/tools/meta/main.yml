---
galaxy_info:
  author: jsh
  description: Install everyday command-line tools
  license: MIT
  min_ansible_version: "2.22"
  platforms:
    - name: MacOSX
      versions: [all]
    - name: Debian
      versions: [all]
    - name: EL
      versions: [all]
dependencies:
  - role: packages
    vars:
      packages_spec: "{{ tools_packages }}"
      packages_extra: "{{ tools_packages_extra | default({}) }}"
