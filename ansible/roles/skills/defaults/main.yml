---
skills_home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
skills_vendor: >-
  {{ (lookup('ansible.builtin.env', 'JSH_VENDOR')
      or (lookup('ansible.builtin.env', 'XDG_DATA_HOME') or skills_home ~ '/.local/share') ~ '/jsh/vendor')
     ~ '/skills' }}
# Machine-local skills: SOURCE (relative to $HOME) TAB NAME; the first list found is used.
skills_local_lists:
  - "{{ (lookup('ansible.builtin.env', 'XDG_CONFIG_HOME') or skills_home ~ '/.config') ~ '/jsh/skills.tsv' }}"
  - "{{ jsh_root }}/local/skills.tsv"
# The ai group installs graphify and reverse-engineer-anything as real directories.
skills_bundled: [github-actions-hardening, show-me-your-work]
skills_repos:
  - {name: anthropics-skills, url: "https://github.com/anthropics/skills.git"}
  - {name: archify, url: "https://github.com/tt-a1i/archify.git"}
  - {name: better-icons, url: "https://github.com/better-auth/better-icons.git"}
  - {name: chrome-agent, url: "https://github.com/sderosiaux/chrome-agent.git"}
  - {name: cloudflare-skills, url: "https://github.com/cloudflare/skills.git"}
  - {name: hallmark, url: "https://github.com/Nutlope/hallmark.git"}
  - {name: humanizer, url: "https://github.com/blader/humanizer.git"}
  - {name: impeccable, url: "https://github.com/pbakaus/impeccable.git"}
  - {name: mattpocock-skills, url: "https://github.com/mattpocock/skills.git"}
  - {name: openai-skills, url: "https://github.com/openai/skills.git"}
  - {name: superpowers, url: "https://github.com/obra/superpowers.git"}
