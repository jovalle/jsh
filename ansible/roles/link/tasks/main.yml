---
- name: Link destinations are checked
  ansible.builtin.stat:
    path: "{{ item.dest }}"
    follow: false
  loop: "{{ link_items }}"
  loop_control:
    label: "{{ item.dest }}"
  register: link_current

- name: Link destinations are not directories
  ansible.builtin.fail:
    msg: "refusing to replace directory: {{ item.item.dest }}"
  loop: "{{ link_current.results }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when: item.stat.isdir | default(false) and not item.stat.islnk

- name: Link backup folder is chosen
  ansible.builtin.set_fact:
    link_backup: "{{ link_state }}/jsh/backups/{{ now(fmt='%Y%m%d-%H%M%S') }}-ansible"

- name: Replaced files are backed up
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - 'mkdir -p "$(dirname "$2")" && cp -Pp "$1" "$2"'
      - sh
      - "{{ item.item.dest }}"
      - "{{ link_backup }}/{{ item.item.dest | regex_replace('^' ~ (link_home ~ '/') | regex_escape, '')
                                             | regex_replace('^/', '') }}"
  loop: "{{ link_current.results }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when: >-
    not ansible_check_mode and item.stat.exists
    and not (item.stat.islnk and item.stat.lnk_target == item.item.src)
  changed_when: false
  check_mode: false

- name: Link folders exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: u+rwx
  loop: "{{ link_items | map(attribute='dest') | map('dirname') | unique }}"

- name: Files are linked
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ link_items }}"
  loop_control:
    label: "{{ item.dest }}"
