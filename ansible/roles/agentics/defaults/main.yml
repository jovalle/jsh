---
agentics_home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
agentics_config: "{{ lookup('ansible.builtin.env', 'XDG_CONFIG_HOME') or agentics_home ~ '/.config' }}"
agentics_state: "{{ lookup('ansible.builtin.env', 'XDG_STATE_HOME') or agentics_home ~ '/.local/state' }}"
# One rules file for every installed agent; each agent's own directory shows it is installed.
agentics_instructions:
  - "{{ agentics_home }}/.codex/AGENTS.md"
  - "{{ agentics_config }}/opencode/AGENTS.md"
  - "{{ agentics_home }}/.claude/CLAUDE.md"
  - "{{ agentics_home }}/.gemini/GEMINI.md"
agentics_helium: "{{ agentics_home }}/Library/Application Support/net.imput.helium"
agentics_native_hosts: "{{ agentics_home }}/.codex/chrome-native-hosts-v2.json"

# antigravity: Linux gets Google's App tarball and agy CLI; macOS gets both from casks.
agentics_antigravity_data: "{{ lookup('ansible.builtin.env', 'XDG_DATA_HOME') or agentics_home ~ '/.local/share' }}"
agentics_antigravity_dir: "{{ agentics_antigravity_data }}/antigravity"
agentics_antigravity_record: "{{ agentics_state }}/jsh/antigravity.json"
agentics_antigravity_releases: https://antigravity-hub-auto-updater-974169037036.us-central1.run.app/releases
agentics_antigravity_artifacts: https://storage.googleapis.com/antigravity-public/antigravity-hub
agentics_antigravity_cli: "{{ agentics_home }}/.local/bin/agy"
agentics_antigravity_cli_manifests: https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests

# skills
agentics_skills_home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
agentics_skills_vendor: >-
  {{ (lookup('ansible.builtin.env', 'JSH_VENDOR')
      or (lookup('ansible.builtin.env', 'XDG_DATA_HOME') or agentics_skills_home ~ '/.local/share') ~ '/jsh/vendor')
     ~ '/skills' }}
# Machine-local skills: SOURCE (relative to $HOME) TAB NAME; the first list found is used.
agentics_skills_local_lists:
  - "{{ (lookup('ansible.builtin.env', 'XDG_CONFIG_HOME') or agentics_skills_home ~ '/.config') ~ '/jsh/skills.tsv' }}"
  - "{{ jsh_root }}/local/skills.tsv"
# Agents that skip ~/.agents/skills (Antigravity, Claude) get a link per skill once AGENT exists.
agentics_skills_mirrors:
  - {agent: "{{ agentics_skills_home }}/.gemini", dest: "{{ agentics_skills_home }}/.gemini/config/skills"}
  - {agent: "{{ agentics_skills_home }}/.claude", dest: "{{ agentics_skills_home }}/.claude/skills"}
# The instructions area installs graphify and reverse-engineer-anything as real directories.
agentics_skills_bundled:
  - github-actions-hardening
  - show-me-your-work
agentics_skills_repos:
  - {name: anthropics-skills, url: "https://github.com/anthropics/skills.git"}
  - {name: archify, url: "https://github.com/tt-a1i/archify.git"}
  - {name: better-icons, url: "https://github.com/better-auth/better-icons.git"}
  - {name: chrome-agent, url: "https://github.com/sderosiaux/chrome-agent.git"}
  - {name: cloudflare-skills, url: "https://github.com/cloudflare/skills.git"}
  - {name: hallmark, url: "https://github.com/Nutlope/hallmark.git"}
  - {name: humanizer, url: "https://github.com/blader/humanizer.git"}
  - {name: impeccable, url: "https://github.com/pbakaus/impeccable.git"}
  - {name: mattpocock-skills, url: "https://github.com/mattpocock/skills.git"}
  - {name: openai-skills, url: "https://github.com/openai/skills.git"}
  - {name: stop-slop, url: "https://github.com/hardikpandya/stop-slop.git"}
  - {name: superpowers, url: "https://github.com/obra/superpowers.git"}
  - {name: thesysdev-skills, url: "https://github.com/thesysdev/skills.git"}
  - {name: ui-ux-pro-max-skill, url: "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git"}
  - {name: unslop, url: "https://github.com/theclaymethod/unslop.git"}
# Published skills: SOURCE (relative to the vendor folder) and NAME under ~/.agents/skills.
agentics_skills_links:
  - {source: anthropics-skills/skills/frontend-design, name: frontend-design}
  - {source: anthropics-skills/skills/skill-creator, name: skill-creator}
