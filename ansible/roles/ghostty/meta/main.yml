---
galaxy_info:
  author: jsh
  description: Install the Ghostty terminal
  license: MIT
  min_ansible_version: "2.22"
  platforms:
    - name: MacOSX
      versions: [all]
    - name: Debian
      versions: [all]
    - name: EL
      versions: [all]
dependencies:
  - role: packages
    vars:
      packages_spec: "{{ ghostty_packages }}"
      packages_extra: "{{ ghostty_packages_extra | default({}) }}"
