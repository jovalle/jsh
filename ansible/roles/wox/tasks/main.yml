---
- name: info
  ansible.builtin.debug:
    msg: "Skipping Wox: no desktop session"
  when: jsh_desktop | length == 0

- name: Wox platform is detected
  ansible.builtin.include_tasks:
    file: "{{ ('darwin' if jsh_platform == 'darwin' else 'linux') ~ '.yml' }}"
  when: jsh_desktop | length > 0

- name: Wox is configured
  when: wox_present | default(false) | bool
  block:
    - name: Wox startup is managed
      ansible.builtin.include_tasks: startup.yml

    - name: Wox native shortcuts are managed
      ansible.builtin.include_tasks:
        file: "{{ 'native-' ~ ('darwin' if jsh_platform == 'darwin' else 'linux') ~ '.yml' }}"
      when: wox_native_shortcuts | bool

    - name: Wox settings database is managed
      ansible.builtin.include_tasks: database.yml
