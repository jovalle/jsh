---
galaxy_info:
  author: jsh
  description: Install Wox, start it at login, and configure its launcher shortcut
  license: MIT
  min_ansible_version: "2.22"
  platforms:
    - name: MacOSX
      versions: [all]
    - name: Debian
      versions: [all]
    - name: EL
      versions: [all]
dependencies:
  - role: packages
    when: not app_apply | default(false) | bool
    vars:
      packages_spec: "{{ wox_packages }}"
      packages_extra: "{{ wox_packages_extra | default({}) }}"
