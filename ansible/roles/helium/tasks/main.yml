---
- name: Helium command is found
  ansible.builtin.command:
    argv: [sh, -c, 'command -v helium']
  register: helium_command
  changed_when: false
  check_mode: false
  failed_when: false

- name: Helium profile root is checked
  ansible.builtin.stat:
    path: "{{ helium_profile_root }}"
  register: helium_root

- name: Helium application is checked
  ansible.builtin.stat:
    path: /Applications/Helium.app
  register: helium_application
  when: jsh_platform == 'darwin'

- name: info
  ansible.builtin.debug:
    msg: "Skipping Helium configuration: Helium is not installed"
  when: >-
    helium_command.rc != 0 and not helium_root.stat.isdir | default(false)
    and not helium_application.stat.isdir | default(false)

- name: Helium configuration is managed
  when: >-
    helium_command.rc == 0 or helium_root.stat.isdir | default(false)
    or helium_application.stat.isdir | default(false)
  block:
    - name: Helium policy values are initialized
      ansible.builtin.set_fact:
        helium_policy_values: >-
          {{ lookup('ansible.builtin.file',
                    jsh_root ~ '/ansible/roles/helium/files/policy.json') | from_json }}

    - name: Helium policy overlays are checked
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ helium_overlays }}"
      register: helium_policy_overlay_stats
      loop_control:
        label: "{{ item }}"

    - name: Helium policy overlays are merged
      ansible.builtin.set_fact:
        helium_policy_values: >-
          {{ helium_policy_values
             | combine(lookup('ansible.builtin.file', item.item) | from_json, recursive=true) }}
      loop: "{{ helium_policy_overlay_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.isreg | default(false)

    - name: Helium macOS policy values are selected
      ansible.builtin.set_fact:
        helium_policy_values: >-
          {{ helium_policy_values
             | combine({'ExtensionForceInstallWithSearchOrNewTabOverridesEnabled': true,
                        'ExtensionInstallForcelist':
                          helium_policy_values.ExtensionInstallForcelist
                          + ['fgmjlmbojbkmdpofahffgcpkhkngfpef']}, recursive=true)
             if jsh_platform == 'darwin' else helium_policy_values }}

    - name: "{{ helium_policy_path }}"
      settings:
        path: "{{ helium_policy_path }}"
        values: "{{ helium_policy_values }}"
        format: "{{ 'plist' if jsh_platform == 'darwin' else 'json' }}"
        merge: replace
        backup: true
      become: "{{ helium_policy_become | bool }}"
      register: helium_policy

    - name: Helium policy change is recorded
      ansible.builtin.set_fact:
        helium_policy_changed: "{{ helium_policy is changed }}"

    - name: Helium policy process is checked
      ansible.builtin.command:
        argv:
          - pgrep
          - -u
          - "{{ lookup('ansible.builtin.pipe', 'id -u') }}"
          - -x
          - helium|Helium|helium-bin
      register: helium_policy_process
      changed_when: false
      check_mode: false
      failed_when: helium_policy_process.rc not in [0, 1]
      when: helium_policy_changed | bool

    - name: notice
      ansible.builtin.debug:
        msg: restart Helium to apply the changed policy
      when: helium_policy_changed | bool and helium_policy_process.rc == 0

    - name: Helium search policy manifest is read
      ansible.builtin.command:
        argv: [plutil, -convert, json, -o, -, "{{ helium_manifest_path }}"]
      register: helium_manifest
      changed_when: false
      check_mode: false
      failed_when: false
      when: jsh_platform == 'darwin'

    - name: notice
      ansible.builtin.debug:
        msg: "cannot verify the temporary Helium search policy; check helium://policy"
      when: jsh_platform == 'darwin' and helium_manifest.rc != 0

    - name: Helium temporary search policy is checked
      ansible.builtin.command:
        argv:
          - jq
          - -e
          - >-
            .. | objects |
            select(.pfm_name? ==
            "ExtensionForceInstallWithSearchOrNewTabOverridesEnabled")
        stdin: "{{ helium_manifest.stdout }}"
      register: helium_manifest_policy
      changed_when: false
      check_mode: false
      failed_when: false
      when: jsh_platform == 'darwin' and helium_manifest.rc == 0

    - name: notice
      ansible.builtin.debug:
        msg: >-
          Helium does not list the temporary search policy; check helium://policy and choose
          Startpage manually if needed
      when: >-
        jsh_platform == 'darwin' and helium_manifest.rc == 0
        and helium_manifest_policy.rc != 0

    - name: Default Helium profile is checked
      ansible.builtin.stat:
        path: "{{ helium_profile_root }}/Default/Preferences"
      register: helium_default_profile

    - name: Helium profiles are found
      ansible.builtin.find:
        paths: "{{ helium_profile_root }}"
        patterns: Preferences
        file_type: file
        recurse: true
        depth: 2
      register: helium_found_profiles
      when: helium_root.stat.isdir | default(false)

    - name: Helium profile candidates are selected
      ansible.builtin.set_fact:
        helium_profiles: >-
          {{ [helium_profile_root ~ '/Default/Preferences']
             if helium_default_profile.stat.isreg | default(false)
             else (helium_found_profiles.files | default([]) | map(attribute='path') | list) }}

    - name: notice
      ansible.builtin.debug:
        msg: open Helium once to create a profile, then rerun
      when: helium_profiles | length == 0

    - name: notice
      ansible.builtin.debug:
        msg: several profiles and no Default profile; choose one by hand
      when: helium_profiles | length > 1

    - name: Helium profile is selected
      ansible.builtin.set_fact:
        helium_preferences: "{{ helium_profiles[0] }}"
        helium_profile: "{{ helium_profiles[0] | dirname }}"
      when: helium_profiles | length == 1

    - name: ok
      ansible.builtin.debug:
        msg: "Helium profile is {{ helium_profile }}"
      when: helium_profiles | length == 1

    - name: Helium profile preferences are managed
      when: helium_profiles | length == 1
      block:
        - name: Helium profile values are selected
          ansible.builtin.command:
            argv:
              - bash
              - -c
              - |
                set -euo pipefail
                preferences=$1
                root=$2
                policy=$3
                set --
                . "${JSH_ROOT:?}/scripts/lib/apps.sh"
                current=${APP_TMP}/current-preferences.json
                app::jsonc "${preferences}" >"${current}"
                jq -n --slurpfile base "${JSH_ROOT}/ansible/roles/helium/files/preferences.json" \
                  --argjson policy "${policy}" --slurpfile current "${current}" '
                  [$policy.ExtensionSettings // {} | to_entries[] |
                    select(.value.toolbar_pin == "force_pinned") | .key] as $pinned |
                  [($policy.ExtensionInstallForcelist // [])[] | split(";")[0]] as $managed |
                  ($current[0].extensions.pinned_extensions // []) as $existing |
                  if ($existing | type) != "array" or any($existing[]; type != "string") then
                    error("Helium pinned extensions must be a string array")
                  else $base[0] * {extensions: {pinned_extensions:
                    ($pinned + [$existing[] | select(. as $id |
                      ($pinned + $managed) | index($id) | not)])}} end
                ' >"${APP_TMP}/preferences.json"
                if [[ -f "${root}/Local State" ]]; then
                  app::jsonc "${root}/Local State" >"${APP_TMP}/current-state.json"
                else
                  printf "{}\n" >"${APP_TMP}/current-state.json"
                fi
                jq -n --slurpfile state "${JSH_ROOT}/ansible/roles/helium/files/state.json" \
                  --slurpfile current "${APP_TMP}/current-state.json" '
                  ($current[0].browser.enabled_labs_experiments // []) as $flags |
                  if ($flags | type) != "array" or any($flags[]; type != "string") then
                    error("Helium experimental flags must be a string array")
                  else $state[0] * {browser: {enabled_labs_experiments:
                    (($flags | map(select(. != "enable-experimental-web-platform-features" and
                      (startswith("enable-experimental-web-platform-features@") | not)))) +
                      ["enable-experimental-web-platform-features"])}} end
                ' >"${APP_TMP}/state.json"
                jq -n --slurpfile preferences "${APP_TMP}/preferences.json" \
                  --slurpfile state "${APP_TMP}/state.json" \
                  '{preferences: $preferences[0], state: $state[0]}'
              - jsh-helium-values
              - "{{ helium_preferences }}"
              - "{{ helium_profile_root }}"
              - "{{ helium_policy_values | to_json }}"
          environment: "{{ jsh_script_env }}"
          register: helium_desired
          changed_when: false
          check_mode: false

        - name: Helium desired profile values are recorded
          ansible.builtin.set_fact:
            helium_preferences_values: "{{ (helium_desired.stdout | from_json).preferences }}"
            helium_state_values: "{{ (helium_desired.stdout | from_json).state }}"

        - name: "{{ helium_preferences }} is pending"
          settings:
            path: "{{ helium_preferences }}"
            values: "{{ helium_preferences_values }}"
          check_mode: true
          register: helium_preferences_pending

        - name: "{{ helium_profile_root }}/Local State is pending"
          settings:
            path: "{{ helium_profile_root }}/Local State"
            values: "{{ helium_state_values }}"
          check_mode: true
          register: helium_state_pending

        - name: ok
          ansible.builtin.debug:
            msg: Helium profile preferences are current
          when: >-
            helium_preferences_pending is not changed and helium_state_pending is not changed

        - name: Helium secure preferences are read
          ansible.builtin.slurp:
            src: "{{ helium_profile }}/Secure Preferences"
          register: helium_secure_file
          failed_when: false

        - name: Helium secure preferences are decoded
          ansible.builtin.set_fact:
            helium_secure: >-
              {{ helium_secure_file.content | b64decode | from_json
                 if helium_secure_file.content is defined else {} }}

        - name: notice
          ansible.builtin.debug:
            msg: >-
              Startpage extension is missing or disabled; restart Helium, enable extension
              downloads, and check helium://extensions
          vars:
            helium_startpage: >-
              {{ (((helium_secure.extensions | default({})).settings | default({}))
                  .fgmjlmbojbkmdpofahffgcpkhkngfpef | default({})) }}
          when: >-
            helium_startpage is not mapping
            or helium_startpage | length == 0
            or helium_startpage.disable_reasons | default([]) is not sequence
            or helium_startpage.disable_reasons | default([]) | length != 0

        - name: ok
          ansible.builtin.debug:
            msg: Startpage extension is installed and enabled
          vars:
            helium_startpage: >-
              {{ (((helium_secure.extensions | default({})).settings | default({}))
                  .fgmjlmbojbkmdpofahffgcpkhkngfpef | default({})) }}
          when: >-
            helium_startpage is mapping
            and helium_startpage | length > 0
            and helium_startpage.disable_reasons | default([]) is sequence
            and helium_startpage.disable_reasons | default([]) | length == 0

        - name: Helium unpacked extension files are checked
          ansible.builtin.stat:
            path: "{{ item }}"
          loop: "{{ helium_unpack_overlays }}"
          register: helium_unpack_stats
          loop_control:
            label: "{{ item }}"
          when: jsh_platform == 'darwin'

        - name: Helium unpacked extension file is selected
          ansible.builtin.set_fact:
            helium_unpack_file: >-
              {{ helium_unpack_stats.results | default([])
                 | selectattr('stat.isreg', 'defined') | selectattr('stat.isreg')
                 | map(attribute='item') | first | default('') }}
          when: jsh_platform == 'darwin'

        - name: Helium unpacked extensions
          ansible.builtin.command:
            argv: ["{{ role_path }}/files/unpacked.sh", "{{ helium_profile }}"]
          environment: "{{ jsh_script_env }}"
          register: helium_unpacked
          changed_when: helium_unpacked.stdout is reported_change
          check_mode: false
          when: jsh_platform == 'darwin' and helium_unpack_file | length > 0

        - name: ok
          ansible.builtin.debug:
            msg: Helium unpacked extensions are current
          when: jsh_platform != 'darwin' or helium_unpack_file | default('') | length == 0

        - name: Helium restarts for its profile settings
          ansible.builtin.include_role:
            name: app
          vars:
            app_label: Helium
            app_process: helium|Helium|helium-bin
            app_launch: "{{ ['open', '-a', 'Helium'] if jsh_platform == 'darwin' else ['helium'] }}"
            app_role: helium
            app_tasks: apply.yml
            app_apply: true
            app_pending: >-
              {{ helium_preferences_pending is changed or helium_state_pending is changed }}
            app_live: false
