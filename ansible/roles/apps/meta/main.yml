---
galaxy_info:
  author: jsh
  description: Install desktop apps and configure their shared integrations
  license: MIT
  min_ansible_version: "2.22"
  platforms:
    - name: MacOSX
      versions: [all]
    - name: Debian
      versions: [all]
    - name: EL
      versions: [all]
dependencies:
  - role: packages
    vars:
      packages_spec: "{{ apps_packages }}"
      packages_extra: "{{ apps_packages_extra | default({}) }}"
