---
- name: displayplacer is found
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - "command -v displayplacer"
  register: desktop_display_displayplacer
  changed_when: false
  check_mode: false
  failed_when: false

- name: Swift is found
  ansible.builtin.command:
    argv:
      - xcrun
      - --find
      - swift
  register: desktop_display_swift
  changed_when: false
  check_mode: false
  failed_when: false

- name: info
  ansible.builtin.debug:
    msg: "Skipping display: displayplacer is not installed"
  when: desktop_display_displayplacer.rc != 0

- name: info
  ansible.builtin.debug:
    msg: "Skipping display: Swift is not available"
  when: desktop_display_displayplacer.rc == 0 and desktop_display_swift.rc != 0

- name: Display resolution profile is read
  ansible.builtin.command:
    argv:
      - xcrun
      - swift
      - "{{ desktop_display_resolution_script }}"
  register: desktop_display_resolution
  changed_when: false
  check_mode: false
  when: desktop_display_displayplacer.rc == 0 and desktop_display_swift.rc == 0

- name: info
  ansible.builtin.debug:
    msg: "Skipping display: no configurable displays"
  when: desktop_display_resolution.stdout is defined and desktop_display_resolution.stdout | length == 0

- name: Display resolution changes are initialized
  ansible.builtin.set_fact:
    desktop_display_pending: []
  when: desktop_display_resolution.stdout is defined and desktop_display_resolution.stdout | length > 0

- name: Display resolution profile is evaluated
  ansible.builtin.include_tasks: display/profile.yml
  loop: "{{ desktop_display_resolution.stdout_lines | default([]) }}"
  loop_control:
    loop_var: desktop_display_profile
    label: "{{ desktop_display_profile | split('\t') | first }}"

- name: Display resolutions are applied
  ansible.builtin.command:
    argv: "{{ [desktop_display_displayplacer.stdout] + (desktop_display_pending | map(attribute='argument') | list) }}"
  changed_when: false
  check_mode: false
  when: desktop_display_pending | default([]) | length > 0 and not ansible_check_mode

- name: Display resolutions are set
  ansible.builtin.command:
    argv:
      - /usr/bin/true
  loop: "{{ desktop_display_pending | default([]) }}"
  loop_control:
    label: "{{ item.label }}"
  changed_when: true
  check_mode: false
