---
- name: info
  ansible.builtin.debug:
    msg: "dock: no GNOME or XFCE session"
  when: jsh_desktop not in ["gnome", "xfce"]

- name: Dock desktop tool is found
  vars:
    desktop_dock_tool_name: >-
      {{ "xfconf-query" if jsh_desktop == "xfce" else "gsettings" }}
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - 'command -v "$1"'
      - sh
      - "{{ desktop_dock_tool_name }}"
  register: desktop_dock_tool
  changed_when: false
  check_mode: false
  failed_when: false
  when: jsh_desktop in ["gnome", "xfce"]

- name: info
  vars:
    desktop_dock_tool_name: >-
      {{ "xfconf-query" if jsh_desktop == "xfce" else "gsettings" }}
  ansible.builtin.debug:
    msg: "dock: {{ desktop_dock_tool_name }} is not installed"
  when: jsh_desktop in ["gnome", "xfce"] and desktop_dock_tool.rc != 0

- name: Managed dock desktop entries are found
  ansible.builtin.command:
    argv:
      - "{{ role_path }}/files/dock/pins.sh"
      - list
  environment: "{{ jsh_script_env }}"
  register: desktop_dock_pins
  changed_when: false
  check_mode: false
  when: jsh_desktop in ["gnome", "xfce"] and desktop_dock_tool.rc == 0

- name: info
  ansible.builtin.debug:
    msg: "dock: no managed applications are installed"
  when: desktop_dock_pins.stdout | default("") | length == 0

- name: XFCE docklike pins are current
  ansible.builtin.command:
    argv:
      - "{{ role_path }}/files/dock/pins.sh"
      - apply
  environment: "{{ jsh_script_env }}"
  register: desktop_dock_xfce
  changed_when: desktop_dock_xfce.stdout is reported_change
  check_mode: false
  when:
    - jsh_desktop == "xfce"
    - desktop_dock_tool.rc == 0
    - desktop_dock_pins.stdout | length > 0

- name: GNOME favorite applications are read
  community.general.dconf:
    key: /org/gnome/shell/favorite-apps
    state: read
  register: desktop_dock_gnome_favorites
  changed_when: false
  check_mode: false
  when:
    - jsh_desktop == "gnome"
    - desktop_dock_tool.rc == 0
    - desktop_dock_pins.stdout | length > 0

- name: GNOME favorite applications include managed pins
  vars:
    desktop_dock_gnome_current: >-
      {{ desktop_dock_gnome_favorites.value | default("@as []")
         | regex_replace("^@as ", "") | from_yaml }}
    desktop_dock_gnome_managed: >-
      {{ desktop_dock_pins.stdout.split(";") | reject("equalto", "")
         | map("regex_replace", "^.*/", "") | list }}
  community.general.dconf:
    key: /org/gnome/shell/favorite-apps
    value: "{{ desktop_dock_gnome_current | union(desktop_dock_gnome_managed) | to_json }}"
  when:
    - jsh_desktop == "gnome"
    - desktop_dock_tool.rc == 0
    - desktop_dock_pins.stdout | length > 0
