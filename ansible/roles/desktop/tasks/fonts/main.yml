---
- name: Font files are checked
  ansible.builtin.stat:
    path: "{{ desktop_fonts_directory }}/{{ item }}"
  loop: "{{ desktop_fonts_files }}"
  register: desktop_fonts_present
  when: jsh_platform != 'darwin'

- name: skip
  ansible.builtin.debug:
    msg: "Skipping JetBrains Mono Nerd Font: not on an internal mirror"
  when: >-
    jsh_mirrors_only | bool and jsh_platform != 'darwin'
    and (jsh_update | bool or desktop_fonts_present.results | rejectattr('stat.exists') | list | length > 0)

- name: Font release
  when: >-
    jsh_platform != 'darwin' and not jsh_mirrors_only | bool
    and (jsh_update | bool or desktop_fonts_present.results | rejectattr('stat.exists') | list | length > 0)
  block:
    - name: JetBrains Mono Nerd Font
      ansible.builtin.command:
        cmd: "true"
        creates: "{{ desktop_fonts_directory }}/{{ desktop_fonts_files[0] }}.preview"
      when: ansible_check_mode

    - name: Font release is read
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ desktop_fonts_repository }}/releases/latest"
        return_content: true
      register: desktop_fonts_release
      when: not ansible_check_mode

    - name: Font download
      when: not ansible_check_mode
      vars:
        desktop_fonts_assets: >-
          {{ desktop_fonts_release.json.assets | selectattr('name', 'equalto', desktop_fonts_asset) | list }}
      block:
        - name: Font release has one verified asset
          ansible.builtin.assert:
            that:
              - desktop_fonts_assets | length == 1
              - desktop_fonts_assets[0].digest | default('') is match('^sha256:[0-9a-f]{64}$')
            fail_msg: "{{ desktop_fonts_asset }}: expected one asset with a SHA-256 digest"

        - name: Font scratch directory
          ansible.builtin.tempfile:
            state: directory
          register: desktop_fonts_scratch
          check_mode: false

        - name: Font archive is downloaded
          ansible.builtin.get_url:
            url: "{{ desktop_fonts_assets[0].browser_download_url }}"
            dest: "{{ desktop_fonts_scratch.path }}/{{ desktop_fonts_asset }}"
            checksum: "{{ desktop_fonts_assets[0].digest }}"
            mode: "0644"
          changed_when: false
          check_mode: false

        - name: Font directory exists
          ansible.builtin.file:
            path: "{{ desktop_fonts_directory }}"
            state: directory
            mode: u+rwx

        - name: JetBrains Mono Nerd Font
          ansible.builtin.unarchive:
            src: "{{ desktop_fonts_scratch.path }}/{{ desktop_fonts_asset }}"
            dest: "{{ desktop_fonts_directory }}"
            include: "{{ desktop_fonts_files }}"
            mode: "0644"
          notify: Font cache is refreshed

        - name: Font scratch directory is removed
          ansible.builtin.file:
            path: "{{ desktop_fonts_scratch.path }}"
            state: absent
          changed_when: false
          check_mode: false

- name: Pending handlers run
  ansible.builtin.meta: flush_handlers
