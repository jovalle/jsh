---
galaxy_info:
  author: jsh
  description: Install kubectl, Helm, Helmfile, and k9s
  license: MIT
  min_ansible_version: "2.22"
  platforms:
    - name: MacOSX
      versions: [all]
    - name: Debian
      versions: [all]
    - name: EL
      versions: [all]
dependencies:
  - role: packages
    vars:
      packages_spec: "{{ kube_packages }}"
      packages_extra: "{{ kube_packages_extra | default({}) }}"
