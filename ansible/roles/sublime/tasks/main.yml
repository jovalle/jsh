---
- name: Sublime Text is found
  ansible.builtin.command:
    argv: [sh, -c, command -v subl]
  register: sublime_command
  changed_when: false
  check_mode: false
  failed_when: false

- name: notice
  ansible.builtin.debug:
    msg: open Sublime Text once, then rerun ./install.sh sublime
  when: >-
    sublime_directory is not directory
    and (sublime_command.rc == 0 or '/Applications/Sublime Text.app' is directory
         or '/var/lib/flatpak/app/com.sublimetext.three' is directory)

- name: info
  ansible.builtin.debug:
    msg: "Skipping Sublime Text settings: Sublime Text is not installed"
  when: >-
    sublime_directory is not directory and sublime_command.rc != 0
    and '/Applications/Sublime Text.app' is not directory
    and '/var/lib/flatpak/app/com.sublimetext.three' is not directory

- name: "{{ sublime_directory }}/Packages/User/Preferences.sublime-settings"
  settings:
    path: "{{ sublime_directory }}/Packages/User/Preferences.sublime-settings"
    source: "{{ role_path }}/files/preferences.json"
  when: sublime_directory is directory
