---
galaxy_info:
  author: jsh
  description: Merge Sublime Text preferences after its first launch
  license: MIT
  min_ansible_version: "2.22"
  platforms:
    - name: MacOSX
      versions: [all]
    - name: Debian
      versions: [all]
    - name: EL
      versions: [all]
dependencies:
  - role: packages
    vars:
      packages_spec: "{{ sublime_packages }}"
      packages_extra: "{{ sublime_packages_extra | default({}) }}"
