---
- name: Waterfox command is found
  ansible.builtin.command:
    argv: [sh, -c, 'command -v waterfox']
  register: waterfox_command
  changed_when: false
  check_mode: false
  failed_when: false

- name: Waterfox profile roots are checked
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ waterfox_roots }}"
  register: waterfox_root_stats
  loop_control:
    label: "{{ item }}"

- name: Waterfox application is checked
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /Applications/Waterfox.app
    - /var/lib/flatpak/app/net.waterfox.waterfox
  register: waterfox_applications
  loop_control:
    label: "{{ item }}"

- name: Waterfox installation is detected
  ansible.builtin.set_fact:
    waterfox_present: >-
      {{ waterfox_command.rc == 0
         or waterfox_root_stats.results | selectattr('stat.isdir', 'defined')
            | selectattr('stat.isdir') | list | length > 0
         or waterfox_applications.results | selectattr('stat.isdir', 'defined')
            | selectattr('stat.isdir') | list | length > 0 }}

- name: info
  ansible.builtin.debug:
    msg: "Skipping Waterfox configuration: Waterfox is not installed"
  when: not waterfox_present

- name: Waterfox configuration is managed
  when: waterfox_present
  block:
    - name: Waterfox native application is checked
      ansible.builtin.stat:
        path: "{{ (waterfox_command.stdout | realpath | dirname) ~ '/application.ini' }}"
      register: waterfox_native
      when: waterfox_command.rc == 0 and jsh_platform != 'darwin'

    - name: Waterfox policy values are initialized
      ansible.builtin.set_fact:
        waterfox_policy_values: >-
          {{ lookup('ansible.builtin.file',
                    jsh_root ~ '/ansible/roles/waterfox/files/policies.json') | from_json }}

    - name: Waterfox policy overlays are checked
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ waterfox_policy_overlays }}"
      register: waterfox_policy_overlay_stats
      loop_control:
        label: "{{ item }}"

    - name: Waterfox policy overlays are merged
      ansible.builtin.set_fact:
        waterfox_policy_values: >-
          {{ waterfox_policy_values
             | combine(lookup('ansible.builtin.file', item.item) | from_json, recursive=true) }}
      loop: "{{ waterfox_policy_overlay_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.isreg | default(false)

    - name: Waterfox policy target is selected
      ansible.builtin.set_fact:
        waterfox_policy_target: >-
          {{ waterfox_policy_path if jsh_platform == 'darwin'
             else (waterfox_command.stdout | realpath | dirname) ~ '/distribution/policies.json' }}
        waterfox_policy_format: "{{ 'plist' if jsh_platform == 'darwin' else 'json' }}"
        waterfox_policy_content: >-
          {{ waterfox_policy_values | combine({'EnterprisePoliciesEnabled': true})
             if jsh_platform == 'darwin' else {'policies': waterfox_policy_values} }}
      when: >-
        jsh_platform == 'darwin'
        or (waterfox_command.rc == 0 and waterfox_native.stat.isreg | default(false))

    - name: Waterfox policy is checked
      settings:
        path: "{{ waterfox_policy_target }}"
        values: "{{ waterfox_policy_content }}"
        format: "{{ waterfox_policy_format }}"
        merge: replace
      check_mode: true
      failed_when: false
      register: waterfox_policy_probe
      when: waterfox_policy_target is defined

    - name: ok
      ansible.builtin.debug:
        msg: "{{ waterfox_policy_target }}"
      when: >-
        waterfox_policy_target is defined and waterfox_policy_probe.msg is not defined
        and waterfox_policy_probe is not changed

    - name: "{{ waterfox_policy_target }}"
      ansible.builtin.command: "true"
      changed_when: true
      check_mode: false
      when: >-
        waterfox_policy_target is defined and waterfox_policy_probe.msg is not defined
        and waterfox_policy_probe is changed and ansible_check_mode

    - name: Waterfox policy admin access is checked
      ansible.builtin.command:
        argv: [sudo, -n, "true"]
      register: waterfox_policy_admin
      changed_when: false
      check_mode: false
      failed_when: false
      when: >-
        waterfox_policy_probe.msg is not defined and waterfox_policy_probe is changed
        and not ansible_check_mode and waterfox_policy_become | bool

    - name: "{{ waterfox_policy_target }}"
      settings:
        path: "{{ waterfox_policy_target }}"
        values: "{{ waterfox_policy_content }}"
        format: "{{ waterfox_policy_format }}"
        merge: replace
      become: "{{ waterfox_policy_become | bool }}"
      when: >-
        waterfox_policy_target is defined and waterfox_policy_probe.msg is not defined
        and waterfox_policy_probe is changed and not ansible_check_mode
        and (not waterfox_policy_become | bool or waterfox_policy_admin.rc | default(1) == 0)

    - name: notice
      ansible.builtin.debug:
        msg: >-
          {{ waterfox_policy_target | default('Waterfox policy') }} needs sudo;
          run `sudo -v` first, then rerun
      when: >-
        waterfox_policy_target is defined
        and (waterfox_policy_probe.msg is defined
             or (waterfox_policy_probe is changed and not ansible_check_mode
                 and waterfox_policy_become | bool
                 and waterfox_policy_admin.rc | default(1) != 0))

    - name: Waterfox profiles.ini files are checked
      ansible.builtin.stat:
        path: "{{ item }}/profiles.ini"
      loop: "{{ waterfox_roots }}"
      register: waterfox_ini_stats
      loop_control:
        label: "{{ item }}/profiles.ini"

    - name: Waterfox profile registrations are read
      ansible.builtin.command:
        argv:
          - awk
          - -f
          - "{{ jsh_root }}/ansible/roles/waterfox/files/profiles.awk"
          - "{{ item.item }}/profiles.ini"
      loop: "{{ waterfox_ini_stats.results }}"
      register: waterfox_registrations
      changed_when: false
      check_mode: false
      when: item.stat.isreg | default(false)
      loop_control:
        label: "{{ item.item }}/profiles.ini"

    - name: Waterfox profile selection is initialized
      ansible.builtin.set_fact:
        waterfox_profiles: []
        waterfox_defaults: []

    - name: Waterfox profile registrations are evaluated
      ansible.builtin.include_tasks: collect.yml
      loop: "{{ waterfox_registrations.results }}"
      loop_control:
        loop_var: waterfox_registration
        label: "{{ waterfox_registration.item.item | default('profiles.ini') }}"
      when: waterfox_registration.stdout_lines is defined

    - name: notice
      ansible.builtin.debug:
        msg: open Waterfox once to create a profile, then rerun
      when: waterfox_profiles | length == 0

    - name: Waterfox profile is selected
      when: waterfox_profiles | length > 0
      block:
        - name: ok
          ansible.builtin.debug:
            msg: "Waterfox has {{ waterfox_profiles | length }} registered profiles"

        - name: Saved Waterfox profile is read
          ansible.builtin.slurp:
            src: "{{ waterfox_state }}/jsh/waterfox-profile"
          register: waterfox_saved_file
          failed_when: false

        - name: Waterfox requested profile is selected
          vars:
            waterfox_saved: >-
              {{ waterfox_saved_file.content | b64decode | trim
                 if waterfox_saved_file.content is defined else '' }}
            waterfox_saved_matches: >-
              {{ waterfox_profiles | selectattr('path', 'equalto', waterfox_saved) | list }}
          ansible.builtin.set_fact:
            waterfox_requested: >-
              {{ (jsh_waterfox_profile
                  | regex_replace('^~/', waterfox_home ~ '/'))
                 if jsh_waterfox_profile else waterfox_saved
                 if waterfox_saved_matches | length == 1 else '' }}
            waterfox_explicit: "{{ jsh_waterfox_profile | length > 0 }}"

        - name: Waterfox requested profile matches are selected
          ansible.builtin.set_fact:
            waterfox_matches: >-
              {{ ((waterfox_profiles | selectattr('name', 'equalto', waterfox_requested) | list)
                  + (waterfox_profiles | selectattr('path', 'equalto', waterfox_requested) | list))
                 | unique(attribute='path') | list }}
          when: waterfox_requested | length > 0

        - name: notice
          ansible.builtin.debug:
            msg: profile name or path must match exactly one existing Waterfox profile
          when: waterfox_requested | length > 0 and waterfox_matches | length != 1

        - name: Waterfox requested profile is valid
          ansible.builtin.assert:
            that: waterfox_matches | length == 1
            fail_msg: profile name or path must match exactly one existing Waterfox profile
          when: waterfox_requested | length > 0

        - name: notice
          ansible.builtin.debug:
            msg: >-
              choose a Waterfox profile with JSH_WATERFOX_PROFILE='name or path'
              ./install.sh waterfox
          when: waterfox_requested | length == 0 and waterfox_defaults | length != 1

        - name: Waterfox selected profile is set
          ansible.builtin.set_fact:
            waterfox_selected: >-
              {{ waterfox_matches[0].path if waterfox_requested | length > 0
                 else waterfox_defaults[0] }}
          when: >-
            (waterfox_requested | length > 0 and waterfox_matches | length == 1)
            or (waterfox_requested | length == 0 and waterfox_defaults | length == 1)

        - name: Waterfox selected profile is managed
          when: waterfox_selected is defined
          block:
            - name: ok
              ansible.builtin.debug:
                msg: "Waterfox profile is {{ waterfox_selected }}"

            - name: Waterfox user preference overlays are checked
              ansible.builtin.stat:
                path: "{{ item }}"
              loop: "{{ waterfox_user_overlays }}"
              register: waterfox_user_overlay_stats
              loop_control:
                label: "{{ item }}"

            - name: Waterfox user preference overlay is selected
              ansible.builtin.set_fact:
                waterfox_user_overlay: >-
                  {{ waterfox_user_overlay_stats.results
                     | selectattr('stat.isreg', 'defined') | selectattr('stat.isreg')
                     | map(attribute='item') | first | default('') }}

            - name: Waterfox user preferences are checked
              ansible.builtin.stat:
                path: "{{ waterfox_selected }}/user.js"
              register: waterfox_user_stat

            - name: Waterfox user preferences are assembled
              ansible.builtin.command:
                argv:
                  - bash
                  - -c
                  - |
                    set -euo pipefail
                    managed=$(mktemp)
                    trap 'rm -f "${managed}"' EXIT
                    cat "$1" >"${managed}"
                    if [[ -n $2 ]]; then
                      printf '\n' >>"${managed}"
                      cat "$2" >>"${managed}"
                    fi
                    current=$3
                    [[ -f ${current} ]] || current=/dev/null
                    awk '
                      FNR == NR {
                        if ($0 ~ /^user_pref\(["\047]/) {
                          key=$0
                          sub(/^user_pref\(["\047]/, "", key)
                          sub(/["\047].*$/, "", key)
                          if (key == "browser.uiCustomization.state") next
                          keys[key]=1
                        }
                        managed=managed $0 "\n"
                        next
                      }
                      $0 == "// BEGIN jsh preferences" { block=1; next }
                      $0 == "// END jsh preferences" { block=0; next }
                      block { next }
                      /^user_pref\(["\047]/ {
                        key=$0
                        sub(/^user_pref\(["\047]/, "", key)
                        sub(/["\047].*$/, "", key)
                        if (key in keys || key == "browser.uiCustomization.state") next
                      }
                      { kept=kept $0 "\n" }
                      END {
                        sub(/[[:space:]]+$/, "", kept)
                        sub(/[[:space:]]+$/, "", managed)
                        if (kept != "") printf "%s\n\n", kept
                        printf "// BEGIN jsh preferences\n%s\n// END jsh preferences\n", managed
                      }
                    ' "${managed}" "${current}"
                  - jsh-waterfox-user
                  - "{{ jsh_root }}/ansible/roles/waterfox/files/user.js"
                  - "{{ waterfox_user_overlay }}"
                  - "{{ waterfox_selected }}/user.js"
              register: waterfox_desired_user
              changed_when: false
              check_mode: false

            - name: "{{ waterfox_selected | default('Waterfox profile') }}/user.js is pending"
              ansible.builtin.copy:
                content: |
                  {{ waterfox_desired_user.stdout }}
                dest: "{{ waterfox_selected }}/user.js"
                mode: "{{ waterfox_user_stat.stat.mode | default('0600') }}"
                backup: true
              check_mode: true
              register: waterfox_user_pending

            - name: Waterfox toolbar extensions are checked
              ansible.builtin.command:
                argv: ["{{ role_path }}/files/toolbar.sh", "{{ waterfox_selected }}"]
                stdin: "{{ waterfox_policy_values | to_json }}"
              environment: >-
                {{ jsh_script_env | combine({'JSH_TOOLBAR_PROBE': '1'}) }}
              register: waterfox_toolbar_probe
              changed_when: false
              check_mode: false

            - name: ok
              ansible.builtin.debug:
                msg: Waterfox profile preferences are current
              when: >-
                waterfox_user_pending is not changed
                and waterfox_toolbar_probe.stdout != 'pending'

            - name: Waterfox restarts for its profile settings
              ansible.builtin.include_role:
                name: app
              vars:
                app_label: Waterfox
                app_process: waterfox|waterfox-bin|Waterfox
                app_launch: >-
                  {{ ['open', '-a', 'Waterfox'] if jsh_platform == 'darwin'
                     else ['flatpak', 'run', 'net.waterfox.waterfox']
                     if waterfox_selected.startswith(waterfox_home ~ '/.var/app/')
                     else ['waterfox'] }}
                app_role: waterfox
                app_tasks: apply.yml
                app_apply: true
                app_pending: >-
                  {{ waterfox_user_pending is changed
                     or waterfox_toolbar_probe.stdout == 'pending' }}
                app_live: true

            - name: Waterfox profile state directory exists
              ansible.builtin.file:
                path: "{{ waterfox_state }}/jsh"
                state: directory
                mode: u+rwx
              when: waterfox_explicit

            - name: "{{ waterfox_state }}/jsh/waterfox-profile"
              ansible.builtin.copy:
                content: |
                  {{ waterfox_selected }}
                dest: "{{ waterfox_state }}/jsh/waterfox-profile"
                mode: "0644"
              when: waterfox_explicit
