---
galaxy_info:
  author: jsh
  description: Merge VS Code settings and install its Linux package when needed
  license: MIT
  min_ansible_version: "2.22"
  platforms:
    - name: MacOSX
      versions: [all]
    - name: Debian
      versions: [all]
    - name: EL
      versions: [all]
dependencies:
  - role: packages
    vars:
      packages_spec: "{{ vscode_packages }}"
      packages_extra: "{{ vscode_packages_extra | default({}) }}"
