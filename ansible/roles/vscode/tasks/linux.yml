---
# Debian and RHEL get Microsoft's package from the update API, verified by its SHA-256.
- name: VS Code package is checked
  ansible.builtin.package_facts:
    manager: auto

- name: VS Code package
  vars:
    vscode_channel: "{{ 'deb' if jsh_platform == 'debian' else 'rpm' }}"
    vscode_arch: "{{ 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64'] else 'x64' }}"
    vscode_api: https://update.code.visualstudio.com/api/update
    vscode_current: "{{ (ansible_facts.packages.code | default([{}]))[0].version | default('') }}"
  when: (vscode_current == '' and not jsh_update | bool) or (vscode_current != '' and jsh_update | bool)
  block:
    - name: VS Code install is planned
      ansible.builtin.set_fact:
        vscode_planned: "{{ ansible_check_mode and vscode_current == '' }}"

    - name: info
      ansible.builtin.debug:
        msg: VS Code update is unchecked in preview
      when: ansible_check_mode and jsh_update | bool and vscode_current != ""

    - name: VS Code private download folder exists
      ansible.builtin.tempfile:
        state: directory
        prefix: jsh-vscode.
      register: vscode_download
      when: not ansible_check_mode

    - name: VS Code release is read
      ansible.builtin.uri:
        url: "{{ vscode_api }}/linux-{{ vscode_channel }}-{{ vscode_arch }}/stable/latest"
        return_content: true
      register: vscode_release
      check_mode: false
      when: not ansible_check_mode

    - name: VS Code package is downloaded
      ansible.builtin.get_url:
        url: "{{ vscode_release.json.url }}"
        dest: "{{ vscode_download.path }}/vscode.{{ vscode_channel }}"
        checksum: "sha256:{{ vscode_release.json.sha256hash }}"
        mode: "0600"
      when: >-
        not ansible_check_mode
        and vscode_current is not search('^' ~ vscode_release.json.productVersion ~ '$')
      changed_when: false

    - name: VS Code
      ansible.builtin.apt:
        deb: "{{ vscode_download.path }}/vscode.deb"
      become: true
      when: >-
        not ansible_check_mode and vscode_channel == 'deb'
        and vscode_current != vscode_release.json.productVersion

    - name: VS Code
      ansible.builtin.dnf:
        name: "{{ vscode_download.path }}/vscode.rpm"
        state: present
        disable_gpg_check: true # local package; verified by its SHA-256 above
      become: true
      when: >-
        not ansible_check_mode and vscode_channel == 'rpm'
        and vscode_current != vscode_release.json.productVersion

    - name: VS Code private download folder is removed
      ansible.builtin.file:
        path: "{{ vscode_download.path }}"
        state: absent
      changed_when: false
      when: not ansible_check_mode
