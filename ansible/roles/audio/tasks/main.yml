---
- name: info
  ansible.builtin.debug:
    msg: "audio policy: no GNOME or XFCE session"
  when: jsh_desktop not in ["gnome", "xfce"]

- name: Audio configuration stops without a desktop session
  ansible.builtin.meta: end_role
  when: jsh_desktop not in ["gnome", "xfce"]

- name: PulseAudio tools are found
  ansible.builtin.command:
    argv: [sh, -c, "command -v pactl"]
  register: audio_pactl
  changed_when: false
  check_mode: false
  failed_when: false
  when: jsh_desktop in ["gnome", "xfce"]

- name: systemd tools are found
  ansible.builtin.command:
    argv: [sh, -c, "command -v systemctl"]
  register: audio_systemctl
  changed_when: false
  check_mode: false
  failed_when: false
  when: jsh_desktop in ["gnome", "xfce"]

- name: Wave:3 udev rules are current
  ansible.builtin.copy:
    src: 70-jsh-wave3.rules
    dest: /etc/udev/rules.d/70-jsh-wave3.rules
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: "{{ audio_become }}"
  notify: Wave:3 udev rules reload
  when:
    - jsh_host == "colossus"
    - audio_pactl.rc == 0

- name: Audio autostart directory exists
  ansible.builtin.file:
    path: "{{ audio_config }}/autostart"
    state: directory
    mode: u=rwx
  when: jsh_host == "colossus" and audio_pactl.rc == 0

- name: Microphone startup mute is configured
  ansible.builtin.template:
    src: microphone.desktop.j2
    dest: "{{ audio_config }}/autostart/jsh-microphone.desktop"
    mode: "0644"
  when: jsh_host == "colossus" and audio_pactl.rc == 0

- name: WirePlumber audio policy source is checked
  ansible.builtin.stat:
    path: "{{ audio_policy_source }}"
    get_checksum: false
  register: audio_policy_file
  when: audio_policy_source | length > 0

- name: WirePlumber policy directory exists
  ansible.builtin.file:
    path: "{{ audio_config }}/wireplumber/wireplumber.conf.d"
    state: directory
    mode: u=rwx
  when: audio_policy_file.stat.isreg | default(false)

- name: WirePlumber audio policy is current
  ansible.builtin.copy:
    src: "{{ audio_policy_source }}"
    dest: "{{ audio_config }}/wireplumber/wireplumber.conf.d/51-jsh-audio-policy.conf"
    remote_src: true
    mode: "0644"
  notify: WirePlumber restarts
  when: audio_policy_file.stat.isreg | default(false)

- name: Audio output shortcut is managed
  ansible.builtin.include_role:
    name: keybindings
    tasks_from: shortcut.yml
  vars:
    keybindings_shortcut_name: Jsh audio output
    keybindings_shortcut_gnome: "<Control><Alt><Super>a"
    keybindings_shortcut_xfce: "<Primary><Alt><Super>a"
    keybindings_shortcut_command: >-
      bash '{{ jsh_root }}/ansible/roles/audio/files/cycle.sh' cycle
    keybindings_shortcut_slug: jsh-audio-output
  when: audio_pactl.rc == 0

- name: Pending handlers run
  ansible.builtin.meta: flush_handlers
