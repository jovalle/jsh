  description: Write global agent instructions and merge OpenCode and Codex settings
  license: MIT
  min_ansible_version: "2.22"
  platforms:
    - name: MacOSX
      versions: [all]
    - name: Debian
      versions: [all]
    - name: EL
      versions: [all]
dependencies:
  - role: packages
    vars:
      packages_spec: "{{ ai_packages }}"
      packages_extra: "{{ ai_packages_extra | default({}) }}"
