---
- name: XFCE shortcut is set
  community.general.xfconf:
    channel: xfce4-keyboard-shortcuts
    property: "/commands/custom/{{ keybindings_shortcut_xfce }}"
    value: ["{{ keybindings_shortcut_command }}"]
    value_type: [string]
  when: jsh_desktop == 'xfce'

- name: GNOME shortcut values are set
  vars:
    keybindings_shortcut_path: >-
      /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/{{ keybindings_shortcut_slug }}/
  community.general.dconf:
    key: "{{ keybindings_shortcut_path }}{{ item.key }}"
    value: "{{ item.value | to_json }}"
  loop:
    - {key: name, value: "{{ keybindings_shortcut_name }}"}
    - {key: binding, value: "{{ keybindings_shortcut_gnome }}"}
    - {key: command, value: "{{ keybindings_shortcut_command }}"}
  loop_control:
    label: "{{ item.key }} is {{ item.value }}"
  when: jsh_desktop == 'gnome'

- name: GNOME custom shortcut paths are read
  community.general.dconf:
    key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings
    state: read
  register: keybindings_custom_paths_read
  changed_when: false
  check_mode: false
  when: jsh_desktop == 'gnome'

- name: GNOME custom shortcut path is listed
  vars:
    keybindings_shortcut_path: >-
      /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/{{ keybindings_shortcut_slug }}/
    keybindings_custom_paths: >-
      {{ (keybindings_custom_paths_read.value | default('@as []')
          | regex_replace('^@as ', '') | from_yaml) | union([keybindings_shortcut_path]) }}
  community.general.dconf:
    key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings
    value: "{{ keybindings_custom_paths | to_json }}"
  when: jsh_desktop == 'gnome'
