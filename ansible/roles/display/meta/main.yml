---
galaxy_info:
  author: jsh
  description: Configure macOS display density or the X11 split-display shortcut
  license: MIT
  min_ansible_version: "2.22"
  platforms:
    - name: MacOSX
      versions: [all]
    - name: Debian
      versions: [all]
    - name: EL
      versions: [all]
dependencies:
  - role: packages
    vars:
      packages_spec: "{{ display_packages }}"
      packages_extra: "{{ display_packages_extra | default({}) }}"
