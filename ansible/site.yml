          ansible.builtin.include_role:
            name: ghostty
            apply:
              tags: [ghostty]
          tags: [ghostty]
      rescue:
        - name: ghostty failure is recorded
          ansible.builtin.set_fact:
            jsh_failed_groups: "{{ jsh_failed_groups + ['ghostty'] }}"

    - name: containers group
      tags: [containers]
      block:
        - name: containers
          ansible.builtin.include_role:
            name: containers
            apply:
              tags: [containers]
          tags: [containers]
      rescue:
        - name: containers failure is recorded
          ansible.builtin.set_fact:
            jsh_failed_groups: "{{ jsh_failed_groups + ['containers'] }}"

    - name: kube group
      tags: [kube]
      block:
