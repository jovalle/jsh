---
# One play configures this workstation. Each setup group is a role included in run order with
# its name as the tag; the role metadata supplies its purpose and supported platforms.
- name: Workstation
  hosts: localhost
  gather_facts: true
  gather_subset: [min]
  pre_tasks:
    - name: Host variables apply
      ansible.builtin.group_by:
        key: "{{ jsh_host }}"
      changed_when: false
      tags: [always]

    - name: Failed groups are initialized
      ansible.builtin.set_fact:
        jsh_failed_groups: []
      tags: [always]

    - name: Detected platform
      ansible.builtin.debug:
        msg: "{{ jsh_platform }} {{ jsh_desktop }} {{ jsh_host }}"
      when: jsh_debug_facts | default(false) | bool
      tags: [always]

  tasks:
    - name: macos group
      tags: [macos]
      block:
        - name: macos
          ansible.builtin.include_role:
            name: macos
            apply:
              tags: [macos]
          tags: [macos]
          when: jsh_platform == 'darwin'
      rescue:
        - name: macos failure is recorded
          ansible.builtin.set_fact:
            jsh_failed_groups: "{{ jsh_failed_groups + ['macos'] }}"

    - name: linux group
      tags: [linux]
      block:
        - name: linux
          ansible.builtin.include_role:
            name: linux
            apply:
              tags: [linux]
          tags: [linux]
          when: jsh_platform != 'darwin'
      rescue:
        - name: linux failure is recorded
          ansible.builtin.set_fact:
            jsh_failed_groups: >-
              {{ jsh_failed_groups + ["linux"] }}

    - name: dev group
      tags: [dev]
      block:
        - name: dev
          ansible.builtin.include_role:
            name: dev
            apply:
              tags: [dev]
          tags: [dev]
      rescue:
        - name: dev failure is recorded
          ansible.builtin.set_fact:
            jsh_failed_groups: "{{ jsh_failed_groups + ['dev'] }}"

    - name: ghostty group
      tags: [ghostty]
      block:
