---
# One play configures this workstation. Each setup group in scripts/groups.tsv is a role,
# included in the same order with its name as the tag.
- name: Workstation
  hosts: localhost
  gather_facts: true
  gather_subset: [min]
  pre_tasks:
    - name: Host variables apply
      ansible.builtin.group_by:
        key: "{{ jsh_host }}"
      changed_when: false
      tags: [always]

    - name: Detected platform
      ansible.builtin.debug:
        msg: "{{ jsh_platform }} {{ jsh_desktop }} {{ jsh_host }}"
      when: jsh_debug_facts | default(false) | bool
      tags: [always]

  tasks:
    - name: macos
      ansible.builtin.include_role:
        name: macos
        apply:
          tags: [macos]
      tags: [macos]
      when: jsh_platform == 'darwin'
    - name: dev
      ansible.builtin.include_role:
        name: dev
        apply:
          tags: [dev]
      tags: [dev]

    - name: ghostty
      ansible.builtin.include_role:
        name: ghostty
        apply:
          tags: [ghostty]
      tags: [ghostty]

    - name: containers
      ansible.builtin.include_role:
        name: containers
        apply:
          tags: [containers]
      tags: [containers]

    - name: kube
      ansible.builtin.include_role:
        name: kube
        apply:
          tags: [kube]
      tags: [kube]

    - name: fonts
      ansible.builtin.include_role:
        name: fonts
        apply:
          tags: [fonts]
      tags: [fonts]

    - name: password
      ansible.builtin.include_role:
        name: password
        apply:
          tags: [password]
      tags: [password]

    - name: tools
      ansible.builtin.include_role:
        name: tools
        apply:
          tags: [tools]
      tags: [tools]

    - name: vscode
      ansible.builtin.include_role:
        name: vscode
        apply:
          tags: [vscode]
      tags: [vscode]

    - name: sublime
      ansible.builtin.include_role:
        name: sublime
        apply:
          tags: [sublime]
      tags: [sublime]

    - name: ai
      ansible.builtin.include_role:
        name: ai
        apply:
          tags: [ai]
      tags: [ai]

    - name: skills
      ansible.builtin.include_role:
        name: skills
        apply:
          tags: [skills]
      tags: [skills]
