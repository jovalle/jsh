          ansible.builtin.include_role:
            name: kube
            apply:
              tags: [kube]
          tags: [kube]
      rescue:
        - name: kube failure is recorded
          ansible.builtin.set_fact:
            jsh_failed_groups: "{{ jsh_failed_groups + ['kube'] }}"

    - name: fonts group
      tags: [fonts]
      block:
