# Host configuration for jsh. scripts/configure.sh sets ANSIBLE_CONFIG to this file; relative paths
# resolve from this directory.
[defaults]
inventory = inventory.yml
roles_path = roles
library = plugins/modules
callback_plugins = plugins/callback
filter_plugins = plugins/filter
test_plugins = plugins/test
collections_path = ../local/ansible/collections
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ../local/ansible/facts
fact_caching_timeout = 3600
interpreter_python = auto_silent
retry_files_enabled = false
deprecation_warnings = false
force_handlers = True

[privilege_escalation]
become_method = sudo
become_flags = -H -S -n
