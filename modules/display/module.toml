description = "Display density on macOS and the ultrawide split shortcut on X11"
when = { desktop = ["darwin", "gnome", "xfce"] }

[[install]]
brew = { formulae = ["displayplacer"] }
when = { platform = "darwin" }

[[configure]]
script = "configure.py"

[commands.toggle]
run = "toggle.sh toggle"
about = "Split or join the ultrawide display (X11)"
