description = "Linters, formatters, and commit tooling with their settings"

[[install]]
brew.formulae = [
  "actionlint",
  "autopep8",
  "bats-core",
  "black",
  "commitizen",
  "commitlint",
  "eslint",
  "gitleaks",
  "hadolint",
  "markdownlint-cli",
  "pre-commit",
  "prettier",
  "pylint",
  "shellcheck",
  "shfmt",
  "yamllint",
]

[[install]]
uv = { check-yaml = "pre-commit-hooks" }
