title = "jsh strict secret detection"
minVersion = "v8.30.1"

[extend]
useDefault = true

[[rules]]
id = "sensitive-file"
description = "Sensitive file must not be committed"
path = '''(?i)(?:^|/)(?:\.env(?:\.[^/]+)?|\.netrc|\.npmrc|\.pypirc|\.dockercfg|\.docker/config\.json|auth\.json|credentials(?:\.[^/]+)?|secrets?(?:\.[^/]+)?|kubeconfig|[^/]+\.(?:key|pem|p12|pfx|kdbx|ovpn|mobileconfig|tfstate(?:\.[^/]+)?))$'''

[[rules.allowlists]]
description = "Allow explicitly marked templates for the sensitive-file path rule"
condition = "AND"
paths = ['''(?i)\.(?:example|sample|template)$''']
