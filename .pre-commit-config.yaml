---
# Pre-commit hooks for code quality
# Install: brew install pre-commit
# Setup: pre-commit install
# Run: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: readme-coverage
        name: check README coverage
        entry: make check-readme
        language: system
        pass_filenames: false
        files: ^(?:README\.md|bin/)

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
        exclude: '\.md$'
      - id: end-of-file-fixer
        name: fix end of files
        entry: end-of-file-fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
      - id: check-yaml
        name: check yaml
        entry: check-yaml
        language: system
        types: [yaml]
        args: [--allow-multiple-documents]
      - id: check-json
        name: check json
        entry: check-json
        language: system
        types: [json]
        exclude: '^\.vscode/extensions\.json$'
      - id: check-added-large-files
        name: check for added large files
        entry: check-added-large-files
        language: system
        stages: [pre-commit, pre-push, manual]
        args: [--maxkb=1000]
      - id: check-case-conflict
        name: check for case conflicts
        entry: check-case-conflict
        language: system
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: check-merge-conflict
        language: system
        types: [text]
      - id: check-executables-have-shebangs
        name: check that executables have shebangs
        entry: check-executables-have-shebangs
        language: system
        types: [text, executable]
        stages: [pre-commit, pre-push, manual]
      - id: check-shebang-scripts-are-executable
        name: check that scripts with shebangs are executable
        entry: check-shebang-scripts-are-executable
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
        exclude: '^tests/.*\.bats$'
      - id: mixed-line-ending
        name: mixed line ending
        entry: mixed-line-ending
        language: system
        types: [text]
        args: [--fix=lf]

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        args: [--severity=warning]
        types: [shell]
        exclude: '(^|/)(\.zshrc|.*\.zsh)$|^(dotfiles/\.zsh/|lib/zsh/)'

      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        args: [--config-file=.yamllint]
        types: [yaml]

      - id: markdownlint
        name: markdownlint
        entry: markdownlint
        language: system
        args: [--config=.markdownlint.json, --fix]
        types: [markdown]

      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: system
        types_or: [javascript, json, markdown]
        exclude: 'package-lock\.json'

      - id: commitlint
        name: commitlint
        entry: commitlint --edit
        language: system
        always_run: true
        stages: [commit-msg]
