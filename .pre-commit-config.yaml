# Pre-commit Configuration for jsh
default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  # ShellCheck - Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        files: \.(sh|bash)$|^j\.sh$|^bin/[^.]+$

  # Conventional commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, docs, test, chore, perf, ci, build, style]

  # Gitleaks - Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args:
          - --config
          - .gitleaks.toml
          - --ignore-gitleaks-allow
          - --max-decode-depth=3
          - --max-archive-depth=2
        stages: [pre-commit]

  # Full outgoing-history and identity scan
  - repo: local
    hooks:
      - id: gitleaks-pre-push
        name: Audit outgoing secrets and identities
        entry: scripts/gitleaks-pre-push.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
