version: "3"

tasks:
  brew:
    desc: Install and upgrade shared, platform, and node-specific Homebrew packages
    platforms: [darwin, linux]
    deps: [brew:trust]
    vars:
      NODE:
        sh: hostname -s | tr '[:upper:]' '[:lower:]'
    preconditions:
      - sh: command -v brew
        msg: Homebrew is required
      - sh: '[ "{{OS}}" != linux ] || { [ -r /etc/os-release ] && grep -Eq ''^ID="?endeavouros"?$'' /etc/os-release; }'
        msg: Linux Homebrew reconciliation requires EndeavourOS
    cmds:
      - brew update
      - brew bundle install --file "{{.ROOT_DIR}}/config/homebrew/Brewfile"
      - cmd: brew bundle install --file "{{.ROOT_DIR}}/config/homebrew/Brewfile.macos"
        platforms: [darwin]
      - cmd: |
          linux_brewfile="{{.ROOT_DIR}}/config/homebrew/Brewfile.linux"
          if [ -r "${linux_brewfile}" ]; then
            brew bundle install --file "${linux_brewfile}"
          fi
        platforms: [linux]
      - |
        node_brewfile="{{.ROOT_DIR}}/config/homebrew/Brewfile.{{.NODE}}"
        if [ -r "${node_brewfile}" ]; then
          brew bundle install --file "${node_brewfile}"
        fi
      - brew upgrade

  brew:trust:
    desc: Trust third-party taps used by the macOS package manifest
    internal: true
    platforms: [darwin]
    preconditions:
      - sh: command -v brew
        msg: Homebrew is required
    vars:
      TAPS: [gromgit/fuse, xguot/difi]
    cmds:
      - for:
          var: TAPS
          as: TAP
        cmd: brew tap "{{.TAP}}" && brew trust --tap "{{.TAP}}"

  packages:
    desc: Install and upgrade packages for the current platform
    platforms: [darwin, linux]
    deps: [brew]
    cmds:
      - task: pacman

  configure:
    desc: Configure every component for this platform, or one named component
    platforms: [darwin, linux]
    vars:
      COMPONENT: '{{default "all" .COMPONENT}}'
    cmds:
      - task: configure:{{.COMPONENT}}

  configure:all:
    internal: true
    cmds:
      - task: configure:settings
      - task: configure:dock
      - task: configure:gecko

  configure:gecko:
    desc: Configure Firefox-family browser profiles
    platforms: [darwin, linux]
    preconditions:
      - sh: command -v curl
        msg: curl is required to install Gecko add-ons
      - sh: command -v jq
        msg: jq is required to read the Gecko add-on manifest
    cmds:
      - bash ./scripts/gecko.sh

  configure:settings:
    desc: Configure macOS preferences
    platforms: [darwin]
    preconditions:
      - sh: command -v defaults
        msg: defaults is required to configure macOS settings
    cmds:
      - defaults write com.apple.AdLib allowApplePersonalizedAdvertising -bool false
      - defaults write com.apple.AdLib allowIdentifierForAdvertising -bool false
      - defaults write com.apple.assistant.support 'Assistant Enabled' -bool false
      - defaults write com.apple.Siri StatusMenuVisible -bool false
      - defaults write com.apple.Siri UserHasDeclinedEnable -bool true
      - defaults write com.apple.assistant.support 'Dictation Enabled' -bool false
      - defaults write com.apple.lookup.shared LookupSuggestionsDisabled -bool true
      - defaults write "$HOME/Library/Preferences/ByHost/com.apple.coreservices.useractivityd" ActivityAdvertisingAllowed -bool false
      - defaults write "$HOME/Library/Preferences/ByHost/com.apple.coreservices.useractivityd" ActivityReceivingAllowed -bool false
      - defaults write com.apple.CrashReporter DialogType -string none
      - defaults write NSGlobalDomain AppleInterfaceStyle -string Dark
      - defaults write com.apple.Spotlight MenuItemHidden -bool true
      - defaults write com.apple.finder ShowExternalHardDrivesOnDesktop -bool false
      - defaults write com.apple.finder ShowHardDrivesOnDesktop -bool false
      - defaults write com.apple.finder ShowMountedServersOnDesktop -bool false
      - defaults write com.apple.finder ShowRemovableMediaOnDesktop -bool false
      - defaults write com.apple.WindowManager StandardHideWidgets -bool true
      - defaults write com.apple.WindowManager StageManagerHideWidgets -bool true
      - defaults write com.apple.finder FXPreferredViewStyle -string Nlsv
      - defaults write com.apple.finder ShowPathbar -bool true
      - defaults write com.apple.finder ShowStatusBar -bool true
      - defaults write com.apple.finder _FXShowPosixPathInTitle -bool true
      - defaults write com.apple.finder AppleShowAllFiles -bool false
      - defaults write NSGlobalDomain NSAutomaticWindowAnimationsEnabled -bool false
      - defaults write NSGlobalDomain NSWindowResizeTime -float 0.001
      - defaults write com.apple.finder DisableAllAnimations -bool true
      - defaults write com.apple.systemsound com.apple.sound.beep.volume -int 0
      - defaults write com.apple.systemsound com.apple.sound.uiaudio.enabled -int 0
      - defaults write NSGlobalDomain com.apple.sound.beep.feedback -bool false
      - defaults write NSGlobalDomain com.apple.sound.beep.volume -float 0
      - defaults write NSGlobalDomain ApplePressAndHoldEnabled -bool false
      - defaults write NSGlobalDomain KeyRepeat -int 2
      - defaults write NSGlobalDomain InitialKeyRepeat -int 15
      - defaults write NSGlobalDomain NSNavPanelExpandedStateForSaveMode -bool true
      - defaults write NSGlobalDomain NSNavPanelExpandedStateForSaveMode2 -bool true
      - defaults write NSGlobalDomain PMPrintingExpandedStateForPrint -bool true
      - defaults write NSGlobalDomain PMPrintingExpandedStateForPrint2 -bool true
      - defaults write NSGlobalDomain NSDocumentSaveNewDocumentsToCloud -bool false
      - defaults write NSGlobalDomain NSAutomaticCapitalizationEnabled -bool false
      - defaults write NSGlobalDomain NSAutomaticDashSubstitutionEnabled -bool false
      - defaults write NSGlobalDomain NSAutomaticPeriodSubstitutionEnabled -bool false
      - defaults write NSGlobalDomain NSAutomaticQuoteSubstitutionEnabled -bool false
      - defaults write NSGlobalDomain NSAutomaticSpellingCorrectionEnabled -bool false
      - defaults write NSGlobalDomain AppleKeyboardUIMode -int 3
      - defaults write com.apple.desktopservices DSDontWriteNetworkStores -bool true
      - defaults write com.apple.desktopservices DSDontWriteUSBStores -bool true
      - defaults write NSGlobalDomain AppleShowAllExtensions -bool true
      - defaults write com.apple.finder FXEnableExtensionChangeWarning -bool false
      - mkdir -p "$HOME/Pictures/Screenshots"
      - defaults write com.apple.screencapture location -string "$HOME/Pictures/Screenshots"
      - defaults write com.apple.screencapture type -string png
      - defaults write com.apple.screencapture disable-shadow -bool true
      - defaults -currentHost write com.apple.ImageCapture disableHotPlug -bool true
      - defaults write com.apple.TimeMachine DoNotOfferNewDisksForBackup -bool true
      - defaults write com.apple.Terminal ShowLineMarks -int 0
      - defaults write com.apple.TextEdit RichText -int 0
      - defaults write com.apple.TextEdit PlainTextEncoding -int 4
      - defaults write com.apple.TextEdit PlainTextEncodingForWrite -int 4
      - killall Finder >/dev/null 2>&1 || true

  configure:dock:
    desc: Configure the Dock for the current platform
    platforms: [darwin, linux]
    preconditions:
      - sh: '[ "{{OS}}" != linux ] || { [ -r /etc/os-release ] && grep -Eq ''^ID="?endeavouros"?$'' /etc/os-release; }'
        msg: Dock configuration on Linux requires EndeavourOS
    cmds:
      - task: configure:dock:macos
      - task: configure:dock:eos

  configure:dock:macos:
    internal: true
    platforms: [darwin]
    preconditions:
      - sh: command -v defaults
        msg: defaults is required to configure the macOS Dock
    cmds:
      - defaults write com.apple.dock persistent-apps -array
      - defaults write com.apple.dock persistent-others -array
      - defaults write com.apple.dock launchanim -bool false
      - defaults write com.apple.dock expose-animation-duration -float 0.1
      - defaults write com.apple.dock wvous-tl-corner -int 0
      - defaults write com.apple.dock wvous-tr-corner -int 0
      - defaults write com.apple.dock wvous-bl-corner -int 0
      - defaults write com.apple.dock wvous-br-corner -int 0
      - defaults write com.apple.dock show-recents -bool false
      - defaults write com.apple.dock autohide -bool true
      - defaults write com.apple.dock autohide-delay -float 0
      - defaults write com.apple.dock autohide-time-modifier -float 0.5
      - defaults write com.apple.dock tilesize -int 48
      - killall Dock >/dev/null 2>&1 || true

  configure:dock:eos:
    internal: true
    platforms: [linux]
    preconditions:
      - sh: command -v xfconf-query
        msg: xfconf-query is required to configure the EndeavourOS dock
    cmds:
      - bash ./scripts/eos/dock.sh

  pacman:
    internal: true
    platforms: [linux]
    vars:
      SUDO:
        sh: '[ "$(id -u)" -eq 0 ] || printf sudo'
    preconditions:
      - sh: command -v pacman
        msg: pacman is required on EndeavourOS
      - sh: '[ "$(id -u)" -eq 0 ] || command -v sudo'
        msg: sudo is required to update EndeavourOS packages
    cmds:
      - "{{.SUDO}} pacman -Syu --noconfirm"
